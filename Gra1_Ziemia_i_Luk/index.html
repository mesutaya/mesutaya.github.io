<title>Ziemia i Łuk — RÓD, Gra 1 (1180–1185)</title>
<style>
:root{--bg:#14110f;--card:#1e1a17;--card2:#29231f;--line:#3a322b;--tx:#eee6d8;--mut:#a39a8c;--acc:#c9a227;--good:#7aa36a;--bad:#d0654d;--blue:#6b8fb3;--vio:#b5523b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:rgba(20,17,15,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 10px}
.hrow{display:flex;align-items:center;gap:4px}
.logo{font-weight:800;letter-spacing:.08em;font-size:11px;color:var(--acc);margin-right:auto;white-space:nowrap}
.stat{font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 6px;white-space:nowrap}
.stat b{font-variant-numeric:tabular-nums}
.qs{border:1px solid var(--acc);color:var(--acc);background:none;border-radius:999px;padding:3px 8px;font-size:12px}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:25px;margin:4px 0 6px;letter-spacing:.02em;font-family:Georgia,"Times New Roman",serif}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:13px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
p{margin:6px 0}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.acc{color:var(--acc)}.good{color:var(--good)}.bad{color:var(--bad)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;background:var(--acc);color:#1d1606;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;margin-top:10px}
.btn2{display:block;width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;margin-top:8px;text-align:left}
.btn2:disabled,.btn:disabled,.choice:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 11px;font-size:13px;min-height:36px}
.chip.on{background:var(--acc);color:#1d1606;border-color:var(--acc);font-weight:700}
.chip.pri.on{background:var(--vio);border-color:var(--vio);color:#fff}
.mem{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.mem:first-child{border:0;margin:0;padding:0}
.bar{height:6px;background:#332b25;border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--good)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px;color:var(--mut)}
.graph{overflow:hidden}
.prin{border-left:3px solid var(--vio);padding:6px 0 6px 10px;margin:8px 0}
.log p{margin:4px 0;font-size:14px}
.choice{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:8px;font-size:15px}
.choice small{display:block;color:var(--mut);margin-top:3px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(24,20,17,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 2px 11px;color:var(--mut);font-size:11px;font-weight:600}
nav button span{display:block;font-size:20px;line-height:1.2}nav button.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#352d27;color:var(--tx);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1}
textarea,input[type=text]{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px}
textarea{min-height:80px}
.grid{display:grid;gap:5px;margin:10px auto;touch-action:manipulation}
.cell{aspect-ratio:1;border-radius:8px;background:#2c2622;border:1px solid var(--line)}
.cell.lit{background:#e07b39;box-shadow:0 0 14px rgba(224,123,57,.7)}
.cell.flash{background:var(--blue);box-shadow:0 0 16px rgba(107,143,179,.8)}
.peg{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;color:#111;margin-right:4px}
.fb{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 2px}
.tray{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.piece{padding:6px;border:2px solid transparent;border-radius:10px;background:var(--card2)}.piece.sel{border-color:var(--acc)}
.pg{display:grid;gap:2px}.pg i{width:16px;height:16px;border-radius:3px;display:block}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.check:first-of-type{border:0}
.box{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800}
.box.on{background:var(--good);border-color:var(--good);color:#0c1a12}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpi div{background:var(--card2);border-radius:10px;padding:8px 4px}.kpi b{display:block;font-size:20px}
.warn{background:rgba(208,101,77,.12);border:1px solid rgba(208,101,77,.4);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.ok{background:rgba(122,163,106,.12);border:1px solid rgba(122,163,106,.4);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
svg text{user-select:none}
.th{font-style:italic;color:#e3d6bf;border-left:2px solid var(--acc);padding:2px 0 2px 10px;margin:10px 0}
img.scene,img.cover{display:block;width:100%;border-radius:10px;margin:6px 0 10px;background:#221d19}
img.cover{aspect-ratio:2/3;object-fit:cover}img.hero{display:block;width:62%;max-width:260px;aspect-ratio:1;object-fit:cover;border-radius:50%;margin:6px auto 10px;border:2px solid var(--line)}img.scene{aspect-ratio:3/2;object-fit:cover}
.pt{width:56px;height:56px;flex:0 0 56px;border-radius:50%;object-fit:cover;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:22px;color:var(--acc)}
.pt.dead{filter:grayscale(1);opacity:.75}
.tmr{height:6px;background:#332b25;border-radius:6px;overflow:hidden;margin:10px 0 2px}.tmr i{display:block;height:100%;width:100%;background:var(--bad);transition:width .1s linear}
.echo{border-color:#5a4a3a;background:#1a1613}.echo p{font-style:italic;color:#d9cdb8}
.chap{margin-top:4px}.crow{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}.carr{text-align:center;color:var(--mut);font-size:12px;line-height:1.2}
.cn{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--mut);background:var(--card2);max-width:100%}
.cn.my{background:var(--acc);color:#1d1606;border-color:var(--acc);font-weight:700}.cn.fd{color:var(--tx)}
.hearts{color:var(--bad);letter-spacing:2px;font-size:13px}
.wi{font-size:13px;margin:3px 0}.wi .good,.wi .bad{font-weight:800}
</style>

/* ================= LOGIKA (bez DOM) ================= */
let G=null;
function blank(){return{v:1,meta:{runs:0,wins:0,disc:0,streak:0,lastFull:'',journal:[],missions:null,plans:{},legacy:[]},run:null};}
function rr(){const r=G.run;let t=(r.rs=(r.rs+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function ri(n){return Math.floor(rr()*n);}
function pick(a){return a[ri(a.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function seeded(seed){let s=seed>>>0;return()=>{let t=(s=(s+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function dkey(off=0){const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const T=(r,m,f)=>r.hero.sex==='f'?f:m;
const lbl=(x,r)=>typeof x==='function'?x(r):x;
const rankName=r=>(r.hero.sex==='f'?RANKS_F:RANKS_M)[r.hero.rank];
const skillName=r=>T(r,'Łuk','Rachunki');
const seasonLabel=s=>`${yearOf(s)} · ${SEAS[s%4]}`;

function newRun(o){
 const seed=((Date.now()&0xffffffff)^Math.floor(Math.random()*4294967296))>>>0;
 G.run={seed,rs:seed};const r=G.run;
 const sex=o.sex||'m';
 const sibF=rr()<.5;
 Object.assign(r,{s:0,phase:'intro',
  hero:{n:o.name||(sex==='f'?pick(NAMES_F):pick(NAMES_M)),sex,bow:0,bxp:0,rank:0,away:0},
  rice:16,seedR:6,plots:3,field:{q:1,q1:0,q2:0,planted:0,st:'empty'},
  laska:45,zas:0,roz:1+Math.min(4,Math.floor(G.meta.disc/5)),
  assign:{},priority:null,queue:[],stats:{owned:0,blamed:0,puz:0,good:0,honest:0,lies:0,ev:0},
  unl:{duty:0,craft:0,bow:0,pz:0,roz:0},
  village:pick(VILLAGES),mentor:pick(MENTORS),steward:pick(STEWARDS),monk:pick(MONKS),
  nbs:shuffle(NAMES_M.slice()).slice(0,3),mapSeed:seed^0x9e3779b9,home:pick(HOME_POS),
  known:['kinugasa','kamakura','kokufu'],seen:[],jpKnown:['kamakura'],jpSeen:['kamakura'],forest:[],
  kamon:{ring:1,motif:'tomoe',n:3,col:'#1d1d1d'},items:[],met:{},chron:[],histDone:{},
  policy:'bal',motto:'',prep:0,ex:null,deserted:0,dead:0});
 r.lord=`${r.village} no Kotarō ${pick(LORD_GIVEN)}`;
 r.family=[
  {id:0,n:r.hero.n,role:T(r,'Ty','Ty'),base:4,e:100,sick:0,alive:1},
  {id:1,n:pick(NAMES_M.filter(x=>x!==r.hero.n)),role:'Ojciec',base:5,e:100,sick:0,alive:1},
  {id:2,n:pick(NAMES_F.filter(x=>x!==r.hero.n)),role:'Matka',base:4,e:100,sick:0,alive:1},
  {id:3,n:sibF?pick(NAMES_F.filter(x=>x!==r.hero.n)):pick(NAMES_M.filter(x=>x!==r.hero.n)),role:sibF?'Młodsza siostra':'Młodszy brat',base:2,e:100,sick:0,alive:1}];
 const gens=shuffle(INTEL.slice()).slice(0,3);
 r.intel=gens.map(g=>{const x=g();const op=shuffle(x.o.filter(v=>v!==x.a)).slice(0,3);op.push(x.a);return{f:x.f,q:x.q,a:x.a,o:shuffle(op),asked:false};});
 initImm(r);
 chron(r,`Początek: ${r.hero.n} z rodziny chłopskiej we wsi ${r.village}, ziemie rodu Miura.`);
 G.meta.runs++;
}
function chron(r,t){r.chron.push({s:r.s,t});}
function fxE(r,v){r.family.forEach(m=>{if(m.alive)m.e=clamp(m.e+v,0,100);});}
function fx(r,o){const out=[];
 if(o.r){r.rice=Math.round((r.rice+o.r)*10)/10;out.push(`ryż ${o.r>0?'+':''}${o.r}`);}
 if(o.l){r.laska=clamp(r.laska+o.l,0,100);out.push(`łaska ${o.l>0?'+':''}${o.l}`);}
 if(o.z){r.zas=Math.max(0,r.zas+o.z);out.push(`zasługa ${o.z>0?'+':''}${o.z}`);}
 if(o.w){r.roz=Math.max(0,r.roz+o.w);out.push(`rozwaga ${o.w>0?'+':''}${o.w}`);}
 if(o.e){fxE(r,o.e);out.push(`siły ${o.e>0?'+':''}${o.e}`);}
 if(o.q){r.field.q=clamp(r.field.q+o.q,.3,1.3);out.push(`pole ${o.q>0?'+':''}${Math.round(o.q*100)}%`);}
 if(o.s){r.seedR=Math.max(0,r.seedR+o.s);out.push(`ziarno ${o.s>0?'+':''}${o.s}`);}
 return out.length?'('+out.join(', ')+')':'';}
function later(r,n,o,msg){r.queue.push({s:r.s+n,o,msg});}
const present=r=>r.family.filter(m=>m.alive&&!(m.id===0&&r.hero.away));
const workers=r=>present(r).filter(m=>!m.sick);
function base(r,m){if(m.id===0)return r.s>=8?5:4;if(m.role.startsWith('Młodsz'))return r.s>=8?3:2;return m.base;}
function eff(e){return e>=60?1:e>=30?.8:.55;}
function acts(r,m){const a=[];const sz=r.s%4;if(sz<3)a.push('field');if(r.unl.duty)a.push('lord');a.push('forest');if(r.unl.craft)a.push('craft');if(m.id===0&&r.unl.bow)a.push('bow');a.push('rest');return a;}
function dutyReq(r){if(!r.unl.duty)return 0;let d=(DUTY[r.s]||3)+(r.dutyExtra||0)+(r.my&&r.my.dutyUp>0?1:0);if(r.hero.away)d=Math.ceil(d/2);return d;}
function fieldNeed(r){const sz=r.s%4;if(sz===3)return 0;const pl=sz===0?Math.min(r.plots,Math.floor(r.seedR/2)):r.field.planted;let n=FIELD_NEED[sz]*pl;if(sz===1&&HIST[r.s]&&HIST[r.s].drought)n=Math.ceil(n*1.4);return n;}

/* ---------- przebieg pory ---------- */
function startSeason(){const r=G.run;ensureImm(r);myTick(r);r.dutyExtra=0;r.ev=null;if(r.s>=4)r.laska=Math.max(1,r.laska-1);r.priority=null;r.help=0;r.pzOpen=false;r.rep=null;
 if(r.s>=1&&!r.unl.duty){r.unl.duty=1;r.unl.pz=1;if(r.hero.rank<1){r.hero.rank=1;chron(r,`${r.hero.n} zaczyna służbę w dworze pana ${r.lord}.`);}}
 if(r.s>=2)r.unl.roz=1;
 if(r.s>=3)r.unl.craft=1;
 if(!r.unl.bow&&(r.hero.rank>=2||r.s>=6)){r.unl.bow=1;}
 // przydział domyślny: zachowaj poprzedni, popraw niedostępne
 present(r).forEach(m=>{const a=r.assign[m.id];if(!a||!acts(r,m).includes(a))r.assign[m.id]=r.s%4<3?'field':'forest';});
 r.pz=r.unl.pz?genPuzzle():null;
 const H=HIST[r.s];
 if(H&&!r.histDone[r.s]){r.phase='hist';(H.reveal||[]).forEach(k=>{if(!r.known.includes(k))r.known.push(k);});(H.jp||[]).forEach(k=>{if(!r.jpKnown.includes(k))r.jpKnown.push(k);});return flushDeath(r);}
 if(r.s===1&&!r.briefed){r.phase='brief';return flushDeath(r);}
 r.phase=planOrQuiet(r);flushDeath(r);}
function histDone(choiceIdx){const r=G.run,H=HIST[r.s];r.histDone[r.s]=1;let txt='';
 if(H.ch&&choiceIdx!=null){const c=H.ch[choiceIdx];txt=c.f(r);if(c.p!=null)txt+=`\n\nZasada: ${PR[c.p][0]}.`;}
 if(H.meet==='tokimasa'){r.met.tokimasa=1;chron(r,'Przy Dankazurze '+T(r,'widziałeś','widziałaś')+', jak Hōjō Tokimasa nosi kamienie razem z ludźmi.');}
 if(H.ceremony)txt=ceremony(r);
 chron(r,`${H.dt}: ${H.t}.`);
 if(H.exp){const ok=canGo(r,H.exp);if(ok){beginExp(r,H.exp);if(txt){r.histRes=txt;r.phase='histres';r.after='exp';}return;}
  if(H.exp==='E2')heijiFate(r);
  if(H.exp==='E4')mentorFate(r);
  else if(H.exp==='E3'){txt=(txt?txt+'\n\n':'')+T(r,'Wojsko Noriyoriego rusza na zachód bez ciebie. Zostajesz przy polu i w dworze.','Pan rusza z wojskiem na zachód. Dwór zostaje na twojej głowie, a wieści przychodzą późno.');}
  else if(H.exp==='E1'||H.exp==='E2'){txt=(txt?txt+'\n\n':'')+T(r,'Pan wybrał innych pachołków. Mentor mówi: „Pracuj u pana i pokaż, że można na tobie polegać. Następnym razem.”','Pan wybrał inne służące do prowadzenia dworu. Mentor mówi: „Pokaż, że można na tobie polegać.”')+` (potrzeba łaski ≥${H.exp==='E1'?48:40} i zasługi ≥${H.exp==='E1'?4:5})`;}}
 if(txt){r.histRes=txt;r.phase='histres';r.after=r.s===1&&!r.briefed?'brief':'plan';return flushDeath(r);}
 r.phase=r.s===1&&!r.briefed?'brief':planOrQuiet(r);flushDeath(r);}
function canGo(r,id){if(r.deserted)return false;
 if(id==='E1'){if(r.hero.rank>=1&&r.laska>=48&&r.zas>=4){promote(r,2);return true;}return false;}
 if(id==='E2'){if(r.hero.rank>=2)return true;if(r.laska>=40&&r.zas>=5){promote(r,2);return true;}return false;}
 return r.hero.rank>=2;}
function promote(r,k){if(r.hero.rank>=k)return;r.hero.rank=k;chron(r,`Awans: ${rankName(r)}.`);if(k>=2)r.unl.bow=1;}

/* ---------- wyprawy ---------- */
function beginExp(r,id){r.ex={id,step:0,prep:r.prep||0,mod:0,earned:0,log:[],path:[]};r.prep=0;r.hero.away=1;r.phase='exp';}
function expStep(){const r=G.run;return EXP[r.ex.id].steps[r.ex.step];}
function expChoose(i){const r=G.run,st=expStep();let t='';const k=r.ex.id+'.'+r.ex.step;
 if(i==='t'&&st.hes){r.fl.hes++;t=st.hes.f(r);recPath(r,k,'h');}
 else if(st.letter){recPath(r,k,['eco','bal','hard'].indexOf(i));r.policy=i;const Nw=T(r,'Napisałeś','Napisałaś');t={eco:Nw+': „Oszczędzajcie siły, dbajcie o zapasy i drewno.”',bal:Nw+': „Pole najpierw, pan zaraz potem, odpoczywajcie na zmianę.”',hard:Nw+': „Pracujcie ile się da — pole i pan.”'}[i];r.stats.good+=0;}
 else if(st.merit){t=meritChoice(r,i);}
 else{recPath(r,k,i);const c=st.ch[i];t=c.f(r)||'';if(c.p!=null)t+=(t?' ':'')+`Zasada: ${PR[c.p][0]}.`;}
 r.ex.log.push(t);r.ex.step++;r.ex.last=t;advanceExp(r);}
function advanceExp(r){const st=expStep();
 if(st&&st.battle){recPath(r,r.ex.id+'.'+r.ex.step,0);r.ex.log.push(battle(r));r.ex.path[r.ex.path.length-1]=r.ex.id+'.'+r.ex.step+':'+r.ex.tier;r.ex.last=r.ex.log[r.ex.log.length-1];r.ex.step++;if(r.dead){return end(false,T(r,'Zginąłeś w bitwie.','Zginęłaś podczas napaści na dwór.'));}
  if(r.ex.id==='E2')heijiFate(r);if(r.ex.id==='E4')mentorFate(r);}
 if(!expStep()){finishExp(r);}else flushDeath(r);}
function battle(r){const ex=r.ex,E=EXP[ex.id];const sk=r.hero.bow;
 let pw=ex.prep*.4+ex.mod*.4+r.hero.e/50+rr()*11-3.8+(r.hero.sex==='f'?r.laska/50+0.9:sk*.6);
 const risk=E.risk*(r.hero.sex==='f'?.35:1);let t;const save=()=>{if(r.hero.sex==='m'&&r.comp.heiji.st==='alive'&&r.comp.heiji.b>=3&&!r.fl.saved){r.fl.saved=1;r.hero.e=15;r.family[0].sick=1;r.family[0].e=15;ex.tier=2;return'Ktoś cię dosięga — i pada, zanim zdąży drugi raz. Strzała Heijiego. Stoi dziesięć kroków dalej, blady, z łukiem, który sam zrobił.';}return null;};ex.tier=0;
 if(rr()<risk*.07){const sv=save();if(sv)return sv;r.dead=1;return T(r,'Zabłąkana strzała. Nawet najlepszych dosięga los.','Pożar dworu w nocy napaści. Nie zdążyłaś uciec.');}

 if(k==='sim'){z.len=Math.min(8,4+Math.floor(r.s/4));z.seq=Array.from({length:z.len},()=>ri(16));z.st='ready';z.pos=0;}
 if(k==='lo'){z.b=Array(16).fill(0);const ps=shuffle([...Array(16).keys()]).slice(0,3+ri(3));ps.forEach(i=>loPress(z.b,i));z.moves=0;z.par=ps.length;}
 return z;}
function loPress(b,i){const x=i%4,y=i>>2;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const a=x+dx,c=y+dy;if(a>=0&&a<4&&c>=0&&c<4)b[c*4+a]^=1;});}
function genPack(){const W=5,H=4,own=Array(W*H).fill(-1);let pid=0;
 const nb=i=>{const x=i%W,y=Math.floor(i/W);return[[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([a,b])=>a>=0&&b>=0&&a<W&&b<H).map(([a,b])=>b*W+a);};
 for(let guard=0;guard<100;guard++){const free=[];own.forEach((v,i)=>{if(v<0)free.push(i);});if(!free.length)break;
  const s=pick(free),target=3+ri(3),cells=[s];own[s]=pid;
  while(cells.length<target){const fr=[];cells.forEach(c=>nb(c).forEach(n=>{if(own[n]<0&&!fr.includes(n))fr.push(n);}));if(!fr.length)break;const c=pick(fr);own[c]=pid;cells.push(c);}
  if(cells.length<3){let tgt=-1;cells.forEach(c=>nb(c).forEach(n=>{if(own[n]>=0&&own[n]!==pid)tgt=own[n];}));if(tgt>=0){cells.forEach(c=>own[c]=tgt);continue;}}
  pid++;}
 const cols=['#c9a227','#6b8fb3','#7aa36a','#b5523b','#9b7bb0','#5aa6a0','#c98a9b','#a9a65b'];
 const pieces=[];for(let p=0;p<pid;p++){let cs=[];own.forEach((v,i)=>{if(v===p)cs.push([i%W,Math.floor(i/W)]);});if(!cs.length)continue;const rot=ri(4);for(let k=0;k<rot;k++)cs=rotShape(cs);pieces.push({c:norm(cs),col:cols[pieces.length%cols.length]});}
 return{W,H,pieces:shuffle(pieces),placed:{},sel:0};}
function norm(cs){const mx=Math.min(...cs.map(c=>c[0])),my=Math.min(...cs.map(c=>c[1]));return cs.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);}
function rotShape(cs){return norm(cs.map(([x,y])=>[-y,x]));}
function packBoard(z){const b=Array(z.W*z.H).fill(-1);for(const p in z.placed){const o=z.placed[p];z.pieces[p].c.forEach(([x,y])=>{b[(y+o.y)*z.W+(x+o.x)]=+p;});}return b;}
function solvePz(){const r=G.run,z=r.pz;z.done=true;z.win=true;r.stats.puz++;r.roz++;
 const o={mm:{r:1},pack:{e:10},sim:{l:2},lo:{z:1}}[z.k];return fx(r,o);}
function useRoz(k){const r=G.run;if(r.roz<2)return null;r.roz-=2;if(k==='help'){r.help=1;return'Sąsiedzi pomogą w polu (+5 pracy w tej porze).';}if(k==='herbs')return'Wywar z ziół. '+fx(r,{e:20});return'Mentor wstawia się za tobą u pana. '+fx(r,{l:6});}

 if(who==='mentor'){r.comp.mentor.st='dead';D.n=r.mentor;D.role='mentor';}

 if(who==='monk'){r.comp.monk={b:0,st:'dead'};D.n=r.monk;D.role='Mnich, brat ojca';}
 if(who==='sib'||who==='father'){const m=who==='sib'?sibM(r):fatM(r);m.alive=0;r.comp[who].st='dead';D.n=m.n;D.role=m.role;r.lostFam=(r.lostFam||0)+1;}
 const it=MEMENTO[who](r);if(it&&!r.items.includes(it))r.items.push(it);D.item=it;
 r.lost.push(D);r.dq.push(who);chron(r,`${D.role} ${D.n} odchodzi. ${how}.`);}

 o.push(war?['grob','Grób nad morzem, kamień zamiast stupy','Pan to widzi']:['grob','Pogrzeb we wsi i wotywa w chramie','−2 ryżu, rodzina razem w żałobie']);

 if(k==='list'&&(who==='mother'||who==='monk')){t=who==='mother'?'Zawijasz sznur z płaskim węzłem w papier i piszesz do ojca. Nie piszesz „nie wiedziałem”. Piszesz: „Ona wolała, żebyś się nie martwił. Ja też wolę.” ':'Zanosisz sznur z paciorkiem ojcu. Ojciec długo go trzyma, potem kładzie na macie i mówi tylko: „Wiedziałem, że patrzy.” ';t+=fx(r,{w:1});}
 else if(k==='list'){t=`Obcinasz kosmyk włosów i zawijasz go w papier. List piszesz długo — ${who==='heiji'?'wędrowny mnich zaniesie go matce Heijiego':'zaniesiesz go sam'}. Za każdym razem zaczynasz od „Nie cierpiał”. `+fx(r,{w:1});}
 if(k==='nem'){t='Namu Amida Butsu. Dziesięć razy. Słowa są cięższe niż strzały. Wszystko przemija — tak mówią mnisi. Nie wiesz, czy w to wierzysz. Ale ręce przestają ci drżeć. '+fx(r,{e:6});}
 if(k==='zem'){r.hero.bxp+=3;t='Znajdujesz go na skarpie. Młodszy od ciebie. Wada spisuje głowę. Nie czujesz nic z tego, co miałeś poczuć. '+fx(r,{z:4});}
 const E=ECHO[who](r,k);E.forEach(([n,tx])=>{if(r.s+n<=LAST_S)r.echo.push({s:r.s+n,t:tx});});
 r.dRes={n:d.n,t};r.phase='deathres';}

 L.push(S.alive?`To ${S.n}. Biegnie, potyka się, biegnie dalej.`:`To nikt. Na słupku przy grobli ktoś postawił słomianego konika.`);
 L.push(F.alive?(r.comp.father.st==='hurt'?`Ojciec idzie wolno, o kiju. Kiwa głową. Więcej nie trzeba.`:`Ojciec stoi przy pługu i udaje, że nie widzi. Potem rzuca pług.`):`Matka stoi sama w drzwiach. Za nią w chacie jest bardzo cicho.`);
 L.push(H.st==='dead'?`Przy drodze do sąsiedniej wsi czeka kobieta. Patrzy na każdego, kto wraca. Nie na ciebie.`:H.st==='hurt'?`Heiji macha z grobli kulą. „Odłożyłem już na pół konia!”`:`Heiji wyprzedza cię na drodze, śpiewając. Pieśń o żurawiu ma teraz zwrotkę o powrocie.`);
 if(r.comp.mentor.st==='dead')L.push(`${r.items.find(i=>i.startsWith('Łuk mentora'))?'Łuk mentora wieszasz nad paleniskiem.':'Myślisz o starym '+r.mentor+'.'} Nikt nie zapyta już, czy ${T(r,'sprawdziłeś','sprawdziłaś')} cięciwę.`);

 if(who==='mother'||who==='monk')return myWhatIf(r,who);
 if(who==='heiji')return r.hero.sex==='m'?[y(F.sandals,'Oddać mu zapasowe sandały w marszu do Kioto'),y(F.tog>=2,`Ćwiczyć z nim łuk co najmniej 2 razy (było: ${F.tog})`),y(!F.charge,'Nie rzucać się samemu po głowę pod Ikutą'),y(r.comp.heiji.b>=3,`Więź 3 — wtedy to on ratuje ciebie (była: ${r.comp.heiji.b})`)]:
  [y(F.sandals,'Upleść mu sandały przed wymarszem (zima 1183)'),y(F.tog>=2,`Uczyć go opatrywać ran co najmniej 2 razy (było: ${F.tog})`)];
 if(who==='mentor')return r.hero.sex==='m'?[y(r.hero.rank>=3,'Zostać rōtō przed Dan-no-ura (stoisz wtedy przy panu zamiast niego)'),y(F.near,'Trzymać się blisko pana i nie zawahać się w prądzie')]:[y(F.near,'Przygotować dwór na powrót rannych: płótno, woda, miejsca')];
 if(who==='sib')return[y(!F.sibHunger,'Zostawić dość ryżu na zimę 1181/82'),y(!F.cold,'Drewno na zimę: las ≥2'),y(!F.sibFever,'Nie posyłać chorego do pracy (zdarzenie „Gorączka”)'),y(r.comp.sib.b>=2,`Więź ≥2 — wcześniej zauważasz gorączkę (była: ${r.comp.sib.b})`)];
 if(who==='father'){const d=r.lost.find(x=>x.who==='father');return d&&d.how.includes('głód')?[y(false,'Mieć zapas ryżu na przednówek (plan zimowy i ziarno siewne)')]:[y(false,'Nie posyłać ojca do służby u pana, gdy ma mniej niż 25 sił'),y(F.fatherW,'Po pierwszym wypadku dać mu odpocząć')];}
 return[];}

/* ---------- schemat rozdziału ---------- */
const BAT_L=r=>T(r,['Chwała','Przetrwanie','Rana'],['Dwór obroniony','Przetrwanie','Rana']);
function chapRows(r,id){const ids=id==='E3b'?['E3','E3b']:[id],rows=[];
 ids.forEach(eid=>EXP[eid].steps.forEach((st,i)=>{const k=eid+'.'+i;
  if(st.letter)rows.push({k,o:['Oszczędnie','Równowaga','Ile się da']});
  else if(st.battle)rows.push({k,o:BAT_L(r)});
  else if(st.merit)return;
  else{const o=st.ch.map(c=>{const t=lbl(c.l,r).replace(/[„”]/g,'');return t.length>24?t.slice(0,22)+'…':t;});if(st.timed)o.push('Wahanie');rows.push({k,o});}}));
 if(id==='E2')rows.push({k:'E2.f',o:['Heiji żyje','Heiji ranny','Heiji ginie']});
 if(id==='E4')rows.push({k:'E4.f',o:['Mentor żyje','Mentor ranny','Mentor ginie']});
 return rows;}
function recPath(r,k,o){if(r.ex){r.ex.path=r.ex.path||[];r.ex.path.push(k+':'+o);}}
function closeChapter(r){const id=r.ex.id;r.chap[id]=(r.ex.path||[]).slice();if(id==='E2'||id==='E4')r.chap[id].push(id+'.f:'+(r.ex.fate||0));
 if(id==='E3')return;const all=id==='E3b'?(r.chap.E3||[]).concat(r.chap.E3b):r.chap[id];
 G.meta.found=G.meta.found||{};const f=G.meta.found[id]=G.meta.found[id]||[];all.forEach(p=>{if(!f.includes(p))f.push(p);});r.chapNew=id;}
function chapterHTML(r,id){const rows=chapRows(r,id),mine=id==='E3b'?(r.chap.E3||[]).concat(r.chap.E3b||[]):(r.chap[id]||[]),found=(G.meta.found||{})[id]||[];
 let tot=0,got=0,h='';rows.forEach((row,ri)=>{if(ri)h+='<div class="carr">↓</div>';h+='<div class="crow">';
  row.o.forEach((lab,oi)=>{const key=row.k+':'+(lab==='Wahanie'?'h':oi);tot++;const my=mine.includes(key),fd=found.includes(key);if(fd)got++;
   h+=`<span class="cn ${my?'my':fd?'fd':''}">${my||fd?esc(lab):'?'}</span>`;});h+='</div>';});
 return`<div class="chap"><div class="row"><b style="flex:3">Schemat rozdziału</b><span class="tag" style="flex:0 0 auto">odkryte ${got}/${tot}</span></div>${h}<p class="xs mut">Złote — twoja droga. Szare — odkryte w innych partiach. „?” — tego jeszcze nie widziałeś.</p></div>`;}

function initMy(r){
 const R=seeded(((r.seed|0)^0x51ED5EED)>>>0),x=R(),W=[['mentor',.24],['steward',.2],['monk',.2],['mother',.22],['village',.14]];

const SIL_T={mentor:'Szeroka sylwetka z łukiem przewieszonym przez plecy. Stawia nogi ostrożnie, jakby bolało kolano. Odłożył ciężar i zniknął bez szelestu.',steward:'Ktoś w czystym kosode, z kluczem u pasa. Klucz brzęknął raz i ucichł, przytrzymany dłonią. Szedł od strony dworu.',monk:'Postać w słomianym kapeluszu i płaszczu z trawy, pochylona jak pielgrzym. Zatrzymała się przed progiem i złożyła dłonie, jakby się modliła.',mother:'Niska postać, boso, w płaszczu naciągniętym na głowę. Zna każdy próg i każdą dechę, bo żadna nie skrzypi. Twarzy nie widać.',village:'Najpierw jeden cień z workiem, potem drugi z wiązką, potem trzeci z dzbanem. Każdy idzie sam i z innej strony. Żaden nie wie o pozostałych.'};
const SIL_D=(r,x)=>`Ktoś przemknął w mroku. Wydawało ci się, że to ${({mentor:'stary '+r.mentor,steward:'zarządca '+r.steward,monk:'mnich '+r.monk,mother:'twoja matka'})[x]}, ale było za daleko i ciemno.`;
const EXPL={mentor:r=>`Niósł ofiarę ryżu do chramu, za duszę swojego pana poległego pod Hōgen.`,steward:r=>'Liczył zapasy dla pana. Pisarz rodu Miura sprawdza spichrze.',monk:r=>'Spał w stodole, bo padało. Mnisi nocują, gdzie jest dach.',mother:r=>'Chodziła do chramu modlić się za ciebie.'};

function giftChoose(v){const r=G.run,m=r.my,k=m.cur,g=GIFT[k],P=[];
 m.gd[k]=1;if(m.t!=='village'&&m.st!=='solved')m.cost++;
 const first=g.fx(r);P.push(first);
 if(k===0)chron(r,'Pod progiem stanął worek ryżu. Nikt nie wie, od kogo.');
 if(m.watch){m.watch=0;fxE(r,-8);const ok=rr()<.75,x=ok?m.t:pick(others(m,true));
  if(ok)addClue(r,{id:'w'+k,txt:SIL_T[m.t],k:'T',who:m.t,pl:'dom'});else addClue(r,{id:'w'+k,txt:SIL_D(r,x),k:'D',who:x,pl:'dom',ex:EXPL[x](r)});
  P.push(T(r,'Czuwałeś całą noc przy progu (siły −8). ','Czuwałaś całą noc przy progu (siły −8). ')+(ok?SIL_T[m.t]:SIL_D(r,x)));}
 if(v==='phys'){addClue(r,{id:'p'+k,txt:PHYS[m.t][k],k:'T',who:m.t,pl:PHYS_PL(m.t,k)});P.push(`Oglądasz ${g.obj}. ${PHYS[m.t][k]}`);}
 else if(v==='ask'){const ok=rr()<.55,x=ok?m.t:pick(others(m,false).filter(z=>RUM_D[z]));
  const txt=ok?RUM_T[m.t]:RUM_D[x](r);addClue(r,{id:'r'+k,txt,k:ok?'T':'D',who:ok?m.t:x,pl:null,ex:ok?null:EXPL[x](r)});P.push('Rozpytujesz we wsi. '+txt);}
 else if(v==='watch'){m.watch=1;P.push('Następnym razem będziesz czekać przy progu. Ktokolwiek to jest, nie będzie sam.');}
 else{P.push('Nie pytasz. Czasem dar ma zostać darem. '+fx(r,{e:3}));}
 m.res=P.join('\n\n');r.phase='giftres';}
function giftNext(){const r=G.run;r.phase=myDue(r)||'plan';}

 {id:'s1',t:'steward',s:[4,7],p:.8,pl:'dwor',txt:r=>`W spichrzu zarządca ${r.steward} liczy worki na sznurku z supełkami. Przy waszym rodzie przesuwa supeł o jeden w dół i nie poprawia. Pewnie się pomylił.`},
 {id:'s2',t:'steward',s:[8,11],p:.7,pl:'dwor',txt:r=>`Zarządca ${r.steward} patrzy na waszą rodzinę przy wale dłużej niż na inne. Gdy łapiesz jego wzrok, odwraca się: „Do roboty!”`},
 {id:'s3',t:'steward',s:[12,15],p:.8,pl:'dwor',need:r=>r.my.cost>=2,txt:r=>`Zarządca ${r.steward} ma podkrążone oczy. Pisarz rodu pytał go przy wszystkich o „ubytki w spichrzu”. Zarządca odpowiedział spokojnie. Za spokojnie.`},

 {id:'k2',t:'monk',s:[8,12],p:.7,pl:null,txt:r=>`Mnich ${r.monk} stoi przy rozstajach i patrzy na wasz dach. „Ta strzecha ma tę samą wadę co strzecha mojego ojca”, mówi do siebie.`},
 {id:'k3',t:'monk',s:[11,14],p:.8,pl:null,need:r=>r.my.cost>=2,txt:r=>`Mnich ${r.monk} jest chudszy niż wiosną. Trzęsą mu się ręce, kiedy zbiera jałmużnę.`},
 {id:'o1',t:'mother',s:[4,7],p:.8,pl:'dom',txt:r=>`Matka nakłada ci pełną miskę. Sobie ledwo dno. „Już jadłam.” ${T(r,'Nie widziałeś','Nie widziałaś')}, kiedy.`},
 {id:'o2',t:'mother',s:[8,11],p:.7,pl:'dom',txt:r=>'Matka ma rano mokry podołek i zimne dłonie. „Poszłam po wodę.” Ale studnia stoi tuż za chatą, a rów jest pełen.'},
 {id:'o3',t:'mother',s:[10,13],p:.8,pl:'dom',need:r=>r.my.cost>=2,txt:r=>'Matka siada na miedzy „na chwilę” i nie wstaje przez długi czas. Potem szybko wraca do pracy, jakby nic.'},
 {id:'v1',t:'village',s:[4,7],p:.8,pl:null,txt:r=>'Dwie sąsiadki milkną przy studni, gdy podchodzisz. Jedna szybko chowa za plecami garść sznurka.'},
 {id:'v2',t:'village',s:[8,11],p:.7,pl:null,txt:r=>'Na targu ktoś pyta ojca: „Dostaliście już?” Ojciec patrzy tępo: „Czego?” Tamten uśmiecha się i odchodzi.'},

 {id:'ds',x:'steward',s:[5,9],p:.55,pl:'dwor',txt:r=>`W nocy w spichrzu świeci lampka. Zarządca ${r.steward} liczy coś cicho, półgłosem.`},
 {id:'dk',x:'monk',s:[5,9],p:.5,pl:'chram',txt:r=>`Sąsiad klnie, że mnich ${r.monk} nocował w jego stodole w noc, gdy ktoś kręcił się wokół waszej chaty.`},
 {id:'do',x:'mother',s:[4,8],p:.5,pl:'dom',txt:r=>'W nocy słyszysz, jak matka wymyka się z chaty. Wraca przed świtem, cicho.'}
];
function myObs(r){const m=r.my;if(!m||m.st==='solved'||r.hero.away)return[];const out=[];
 for(const o of OBS){if(out.length>=2)break;if(m.seen[o.id])continue;if(o.t&&o.t!==m.t)continue;if(o.x&&o.x===m.t)continue;
  if(r.s<o.s[0]||r.s>o.s[1])continue;if(o.need&&!o.need(r))continue;if(rr()>o.p)continue;
  m.seen[o.id]=1;const txt=o.txt(r);addClue(r,{id:o.id,txt,k:o.t?'T':'D',who:o.t||o.x,pl:o.pl,ex:o.x?EXPL[o.x](r):null});out.push('🔍 '+txt);}
 return out;}

/* ---------- konsekwencje ukrytego kosztu (gdy sprawa nierozwiązana) ---------- */
function myDue(r){const m=r.my;if(!m||r.hero.away)return null;
 const gk=GIFT_S.indexOf(r.s);
 if(gk>=0&&!m.gd[gk]){
  if(m.st==='solved'){m.gd[gk]=1;if(!m.noGifts){const tx=GIFT[gk].fx(r);r.echo.push({s:r.s,t:`${myName(r,m.t)} nie ukrywa już, że pomaga. ${tx}`});}return null;}
  m.cur=gk;return'gift';}
 if(CASE_S.includes(r.s)&&!m.cd[r.s]&&m.st!=='solved'&&m.gd[0]&&(r.s===CASE_S[2]||m.clues.length>=2))return'case';
 return null;}
function myTick(r){const m=r.my;if(!m||m.st==='solved')return;
 if(m.t==='steward'&&r.s===15&&m.cost>=3&&!m.steDown){m.steDown=1;m.dutyUp=99;r.laska=clamp(r.laska-4,0,100);chron(r,`Zarządca ${r.steward} odesłany ze dworu.`);
  r.echo.push({s:r.s,t:`Nowy zarządca liczy każdy worek. ${r.steward} odszedł rano, bez słowa. Pan mówi, że w księgach brakowało. Kto wie, ile. (służba +1 do końca wojny, łaska −4)`});}
 if(m.t==='monk'&&r.s===13&&m.cost>=3&&!m.gone){m.gone=1;}
 if(m.t==='mother'&&r.s===10&&m.cost>=3&&r.family[2].alive&&!m.sickDone){m.sickDone=1;r.family[2].sick=2;chron(r,`Matka ${r.family[2].n} choruje.`);r.echo.push({s:r.s,t:'Matka kaszle w rękaw. „To od dymu.” Nie wygląda, jakby to było od dymu.'});}}
function myEnd(r){const m=r.my;if(!m)return;
 if(m.dutyUp>0&&m.dutyUp<99)m.dutyUp--;
 if(m.t==='mother'&&m.st!=='solved'&&r.family[2].alive&&r.s>=6&&r.assign[2]==='rest'){m.restN++;m.cost=Math.max(0,m.cost-.5);}
 if(r.s===19)myFate(r);}
function myFate(r){const m=r.my;if(!m||m.st==='solved'||m.ease)return;
 if(m.t==='mother'&&m.cost>=4&&r.family[2].alive)addDeath(r,'mother','Zima 1184/85 — wycieńczenie, o którym nikt nie wiedział');}
function myFinale(r){const m=r.my;if(!m||m.st==='solved')return;
 if(m.t==='monk'&&m.gone&&!r.lost.some(d=>d.who==='monk'))addDeath(r,'monk','Zima 1183/84 — w drodze, w górach Hakone');}
function myMentorExtra(r){const m=r.my;return m&&m.t==='mentor'&&m.st!=='solved'&&!m.ease?Math.min(.2,m.cost*.05):0;}

/* ---------- oskarżenie i odsłona ---------- */
function caseOpts(r){return MY_T.filter(t=>!r.my.wrong.includes(t));}
const WRONG={
 mentor:r=>`Stary ${r.mentor} marszczy brwi. „Ja? Mam dość własnych kłopotów.” Rano wyjaśnia, że o świcie chodzi do chramu z ofiarą za zmarłego pana. Czujesz, że przesadziłeś.`.replace('przesadziłeś',T(r,'przesadziłeś','przesadziłaś')),
 steward:r=>`Zarządca ${r.steward} pyta chłodno, czy zarzucasz mu coś przed świadkami. „Mam sześć gąb i księgę. Liczę nocą, bo pisarz liczy każdy worek.” Wieś słyszy każde słowo.`,
 monk:r=>`Mnich ${r.monk} uśmiecha się łagodnie. „Nocowałem w stodole, bo padało. Nie rozdaję ryżu, sam żyję z cudzego.”`,
 mother:r=>'Matka patrzy zdumiona, potem śmieje się cicho. „Przed świtem chodzę do chramu. Modlę się za ciebie.” Nie wie, że właśnie ją o coś oskarżyłeś.'.replace('oskarżyłeś',T(r,'oskarżyłeś','oskarżyłaś')),
 village:r=>'Pytasz ludzi pod chramem, czy to oni. Wszyscy kręcą głowami, ktoś się śmieje. Wieś zaczyna plotkować, że ci odbiło.'};
function caseChoose(v){const r=G.run,m=r.my;m.cd[r.s]=1;
 if(v==='no'){r.phase='plan';return;}
 if(v===m.t){m.q=m.clues.filter(c=>c.k==='T'&&c.who===m.t).length;m.st='solved';m.ss=r.s;r.phase='reveal';return;}
 m.wrong.push(v);const pen=v==='steward'?6:4;r.laska=clamp(r.laska-pen,0,100);
 m.res=WRONG[v](r)+` (łaska −${pen})\n\nTo nie on. Tracisz trop, ale zyskujesz pewność: ${v==='village'?'to jednak ktoś jeden':myName(r,v).toLowerCase()+' odpada'}.`;
 r.phase='caseres';}
function caseNext(){G.run.phase='plan';}
function revChoose(i){const r=G.run,m=r.my,c=REV[m.t].ch[i];let t=c.f(r,m);
 const bonus=m.q>=3?1:0;if(bonus)t+=' '+fx(r,{w:1})+'\n\n'+T(r,'Doszedłeś do tego rozumem, nie zgadując.','Doszłaś do tego rozumem, nie zgadując.');
 else if(m.q<2)t+='\n\n'+T(r,'Trafiłeś, choć wiedziałeś niewiele. Ktoś nad tobą czuwał.','Trafiłaś, choć wiedziałaś niewiele. Ktoś nad tobą czuwał.');
 chron(r,`Sprawa węzła wyjaśniona: ${myName(r,m.t).toLowerCase()}.`);
 m.res=t;r.phase='caseres';}
const REV={
 mentor:{d:r=>`Stary ${r.mentor} nie udaje zaskoczenia. Siedzi na progu dworu z łukiem na kolanach. „Długo ci to zajęło.” Potem mówi o zimie po Hōgen: ranny, bez pana, w śniegu. Wasz dziadek znalazł go przy drodze i trzymał trzy miesiące w stodole, choć ludzie z obcego rodu szukali takich jak on. „Dług nie ginie z człowiekiem. Przechodzi na dzieci.”`,

 steward:{d:r=>`Zarządca ${r.steward} zamyka drzwi spichrza. Liczy sznurek do końca, jakbyś ${T(r,'nie stał','nie stała')} obok. „Wasz ojciec ukrył mojego syna w stodole, kiedy obcy jeźdźcy przeszli przez wieś tej jesieni. Nigdy nie spytał o nagrodę. Ja piszę dwa tam, gdzie jest trzy. To nie dar. To fałsz w księgach.”`,
  th:r=>'„Surowy, bo musi. Dobry, bo nie umie inaczej. Ale księgi to księgi.”',

   {l:'„Nikomu nie powiem. Ale to ostatni raz.”',f:(r,m)=>{m.cost=Math.max(0,m.cost-1);if(rr()<.4)later(r,2,{l:-10,z:-3},'Pisarz rodu sprawdził spichrz i znalazł rozbieżności. Zarządca stanął przed panem.');return'Zarządca kiwa głową. „Dobrze.” Nie wiesz, czy to dobrze.';}},
   {l:r=>T(r,'„Jestem winien panu prawdę.”','„Jestem winna panu prawdę.”'),f:(r,m)=>{m.noGifts=1;m.steDown=1;m.dutyUp=99;chron(r,`Zarządca ${r.steward} odesłany ze dworu po zgłoszeniu.`);return'Zarządca nie broni się. Rano pan odsyła go ze dworu. Nowy liczy ściśle (służba +1 do końca wojny). Ojciec nie patrzy ci w oczy przez tydzień. '+fx(r,{l:5,z:1});}}]},
 monk:{d:r=>`Mnich ${r.monk} zdejmuje słomiany kapelusz. Twarz ma ojca, tylko starszą. „Jirō. Brat twojego ojca. Zostawiłem ziemię w czasie głodu, żeby było mniej gęb przy misce. Obiecałem sobie, że nie pokażę się nigdy. Ale patrzeć nie przestałem.”`,

  if(!z.done)h+=`<div style="margin:12px 0;min-height:32px">${z.cur.map(peg).join('')}${'<span class="peg" style="background:#2c2622"></span>'.repeat(4-z.cur.length)}</div><div class="chips">${[1,2,3,4,5,6].map(d=>`<button class="chip" style="min-width:44px;background:${col[d]};color:#111;font-weight:800" data-a="mmD" data-v="${d}">${d}</button>`).join('')}</div><div class="row" style="margin-top:8px"><button class="btn2" style="text-align:center" data-a="mmBack">⌫ Cofnij</button><button class="btn" style="margin-top:8px" data-a="mmGo" ${z.cur.length<4?'disabled':''}>Sprawdź (${z.g.length+1}/8)</button></div>`;
  else if(!z.win)h+=`<p>Znaki: ${z.code.map(peg).join('')}</p>`;}
 if(z.k==='pack'){const b=packBoard(z);h+=`<div class="grid" style="grid-template-columns:repeat(${z.W},1fr);max-width:320px">${b.map((p,i)=>`<div class="cell" data-a="${z.done?'':'pkCell'}" data-v="${i}" style="${p>=0?'background:'+z.pieces[p].col:''}"></div>`).join('')}</div>`;
  if(!z.done)h+=`<div class="tray">${z.pieces.map((p,k)=>{if(z.placed[k]!=null)return'';const w=Math.max(...p.c.map(c=>c[0]))+1,hh=Math.max(...p.c.map(c=>c[1]))+1;let cells='';for(let y=0;y<hh;y++)for(let x=0;x<w;x++){const ix=p.c.findIndex(c=>c[0]===x&&c[1]===y);cells+=`<i style="background:${ix>=0?p.col:'transparent'};${ix===0?'box-shadow:inset 0 0 0 5px rgba(0,0,0,.45)':''}"></i>`;}return`<button class="piece ${z.sel===k?'sel':''}" data-a="pkSel" data-v="${k}"><div class="pg" style="grid-template-columns:repeat(${w},16px)">${cells}</div></button>`;}).join('')}</div><button class="btn2" style="text-align:center" data-a="pkRot">⟳ Obróć wybrany</button>`;}

 if(z.k==='lo')h+=`<div class="grid" style="grid-template-columns:repeat(4,1fr);max-width:300px">${z.b.map((v,i)=>`<div class="cell ${v?'lit':''}" data-a="${z.done?'':'loCell'}" data-v="${i}"></div>`).join('')}</div><p class="sm">Ruchy: ${z.moves} · da się w ${z.par} lub mniej</p>`;

function todayMissions(){const M=G.meta,d=dkey();if(!M.missions||M.missions.date!==d){const rnd=seeded(hashStr(d));const ids=[];while(ids.length<3){const i=Math.floor(rnd()*MISSIONS.length);if(!ids.includes(i))ids.push(i);}M.missions={date:d,ids,done:[false,false,false]};}return M.missions;}

 ms.ids.forEach((id,i)=>{h+=`<div class="check" data-a="mis" data-v="${i}"><div class="box ${ms.done[i]?'on':''}">${ms.done[i]?'✓':''}</div><div>${esc(MISSIONS[id])}</div></div>`;});

 h+=`<div class="card"><h2>📋 Priorytety na dziś</h2>`;if(tp&&tp.items.some(x=>x.trim()))tp.items.forEach((it,i)=>{if(it.trim())h+=`<div class="check" data-a="planDone" data-v="${i}"><div class="box ${tp.done[i]?'on':''}">${tp.done[i]?'✓':''}</div><div><b>${i+1}.</b> ${esc(it)}</div></div>`;});else h+=`<p class="sm mut">Zaplanuj jutro — poniżej.</p>`;
 h+=`</div><div class="card"><h2>🗓 Plan na jutro</h2><p class="xs mut">Najpierw najważniejsze: tylko 3 rzeczy.</p>${[0,1,2].map(i=>`<input type="text" style="margin-top:8px" data-in="plan" data-v="${i}" placeholder="${i+1}. najważniejsze" value="${esc(np.items[i]||'')}">`).join('')}</div>`;

 h+=`<div class="card"><h2>⚔️ Droga łuku i konia</h2><p class="xs mut">Zasady w duchu „Extreme Ownership” (J. Willink, L. Babin), opowiedziane słowami starego wojownika. „Bushidō” jako spisany kodeks to dopiero epoka Edo — w 1180 r. mówiono o „drodze łuku i konia” (kyūba no michi).</p>${PR.map(p=>`<div class="prin"><b>${p[0]}</b><br><span class="sm">„${p[1]}”</span><br><span class="xs mut">W grze: ${p[2]}</span></div>`).join('')}</div>`;
 return h;}

let tt;function toast(m,ms=2400){const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms);}
function stamp(){const d=new Date();return d.toLocaleDateString('pl-PL')+' '+d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});}
function copyFrom(id,txt){const t=document.getElementById(id);if(txt!=null)t.value=txt;t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Skopiowano. Wklej np. do Notatek.'),()=>toast('Zaznaczono — skopiuj ręcznie.'));}catch(e){toast('Zaznaczono — skopiuj ręcznie.');}}

const toTop=()=>{try{scrollTo(0,0);}catch(e){}};

 tab:v=>{UI.tab=v;toTop();},
 sx:v=>{UI.setup.sex=v;},

 evNext:()=>{endSeason();toTop();},
 exp:v=>{const st=expStep();expChoose(st.letter||v==='t'?v:+v);toTop();},
 site:v=>{const x=SITES[v];toast(`${x[2]}: ${x[3]}`,4000);return'norender';},
 jsite:v=>{const x=JSITES[v];toast(`${x[2]}${x[3]?': '+x[3]:''}`,4000);return'norender';},
 copyLeg:()=>{copyFrom('leg');return'norender';},

  G.meta.journal.unshift({d:dkey(),op:`${r.hero.n} z ${r.village}`,win:r.res.win,l:l||r.res.lessons[0]});G.meta.journal=G.meta.journal.slice(0,40);
  G.meta.legacy.unshift({d:dkey(),code:legacy(r)});G.meta.legacy=G.meta.legacy.slice(0,5);G.run=null;UI.tab='gra';toTop();},
 abandon:()=>{if(UI.confirm!=='abandon'){UI.confirm='abandon';toast('Dotknij jeszcze raz, by porzucić partię.');return;}UI.confirm=null;G.run=null;UI.tab='gra';},
 pzOpen:()=>{G.run.pzOpen=true;toTop();},

 mmD:v=>{const z=G.run.pz;if(z.cur.length<4)z.cur.push(+v);},
 mmBack:()=>{G.run.pz.cur.pop();},
 mmGo:()=>{const z=G.run.pz;if(z.cur.length<4)return;const g=z.cur.slice();let b=0,w=0;const cc={},gc={};g.forEach((d,i)=>{if(d===z.code[i])b++;else{cc[z.code[i]]=(cc[z.code[i]]||0)+1;gc[d]=(gc[d]||0)+1;}});for(const d in gc)w+=Math.min(gc[d],cc[d]||0);z.g.push({g,b,w});z.cur=[];
  if(b===4)toast('Szyfr złamany! Rozwaga +1 '+solvePz());else if(z.g.length>=8){z.done=true;z.win=false;toast('Nie tym razem.');}},
 pkSel:v=>{G.run.pz.sel=+v;},
 pkRot:()=>{const z=G.run.pz;if(z.sel==null||z.placed[z.sel])return;z.pieces[z.sel].c=rotShape(z.pieces[z.sel].c);},
 pkCell:v=>{const z=G.run.pz,i=+v,b=packBoard(z);if(b[i]>=0){const p=b[i];delete z.placed[p];z.sel=p;return;}
  if(z.sel==null||z.placed[z.sel]!=null){toast('Wybierz tobołek z dołu.');return;}
  const p=z.pieces[z.sel],an=p.c[0],tx=i%z.W,ty=Math.floor(i/z.W),ox=tx-an[0],oy=ty-an[1];
  const ok=p.c.every(([x,y])=>{const X=x+ox,Y=y+oy;return X>=0&&Y>=0&&X<z.W&&Y<z.H&&b[Y*z.W+X]<0;});
  if(!ok){toast('Nie mieści się tutaj.');return;}z.placed[z.sel]={x:ox,y:oy};const nx=z.pieces.findIndex((q,k)=>z.placed[k]==null);z.sel=nx>=0?nx:null;
  if(packBoard(z).every(c=>c>=0))toast('Wóz załadowany! Rozwaga +1 '+solvePz());},
 simShow:()=>{const z=G.run.pz;z.st='show';z.pos=0;render();runSim();return'norender';},
 simCell:v=>{const z=G.run.pz;if(z.st!=='input')return'norender';const i=+v;flash(i);if(z.seq[z.pos]===i){z.pos++;if(z.pos>=z.seq.length){z.st='ok';toast('Sygnały zapamiętane! Rozwaga +1 '+solvePz());}else return'norender';}else{z.st='fail';toast('Pomyłka.');}},

 mis:v=>{const M=G.meta,ms=todayMissions(),i=+v;ms.done[i]=!ms.done[i];M.disc+=ms.done[i]?1:-1;
  if(ms.done.every(Boolean)&&M.lastFull!==dkey()){M.streak=M.lastFull===dkey(-1)?M.streak+1:1;M.lastFull=dkey();M.disc+=2;toast(`Wszystkie misje! Seria: ${M.streak} 🔥`);}},

 qsave:()=>{const s=getSlots();s.q={t:stamp(),d:desc(G),g:G};toast(setSlots(s)?'Zapisano (szybki zapis).':'Nie udało się — użyj kodu zapisu.');},
 slotSave:v=>{const s=getSlots();s[v]={t:stamp(),d:desc(G),g:G};toast(setSlots(s)?`Zapisano w slocie ${v}.`:'Błąd zapisu — użyj kodu.');},

 copyCode:()=>{copyFrom('code',enc(G));return'norender';},
 loadCode:()=>{const t=document.getElementById('imp');try{G=dec(t.value);UI.tab='gra';toast('Wczytano z kodu.');}catch(e){toast('To nie jest poprawny kod zapisu.');}},
 reset:()=>{if(UI.confirm!=='reset'){UI.confirm='reset';toast('Dotknij jeszcze raz, by skasować wszystko.');return;}UI.confirm=null;G=blank();toast('Wyczyszczono.');}
};
function runSim(){const z=G.run.pz;let k=0;const step=()=>{if(!G.run||G.run.pz!==z||z.st!=='show')return;if(k>=z.seq.length){z.st='input';z.pos=0;save();render();return;}flash(z.seq[k],'lit',450);k++;setTimeout(step,700);};setTimeout(step,500);}
function flash(i,cls='flash',ms=250){const el=document.querySelector(`[data-cell="${i}"]`);if(!el)return;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms);}
function boot(){G=loadAuto();
 document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||!el.dataset.a)return;const f=A[el.dataset.a];if(!f)return;if(el.dataset.a!=='abandon'&&el.dataset.a!=='reset')UI.confirm=null;
  let res;try{res=f(el.dataset.v,el);}catch(err){console.error(err);toast('Błąd: '+err.message);}save();if(res!=='norender')render();});
 document.addEventListener('input',e=>{const el=e.target,k=el.dataset.in;if(!k)return;
  if(k==='hname')UI.setup.name=el.value;
  if(k==='lesson'&&G.run){G.run.lesson=el.value;const t=document.getElementById('leg');if(t)t.value=legacy(G.run);}
  if(k==='motto'&&G.run){G.run.motto=el.value;const t=document.getElementById('leg');if(t)t.value=legacy(G.run);}
  if(k==='plan'){const d=dkey(1);const p=G.meta.plans[d]||(G.meta.plans[d]={items:['','',''],done:[false,false,false]});p.items[+el.dataset.v]=el.value;const ks=Object.keys(G.meta.plans).sort();while(ks.length>14)delete G.meta.plans[ks.shift()];}
  save();});
 if(G.run&&G.run.pz&&G.run.pz.k==='sim'&&G.run.pz.st==='show')G.run.pz.st='ready';
 render();}

/* ---------- widoki immersji ---------- */
function thought(t){return`<p class="th">${esc(t)}</p>`;}
function timerBar(act){return timedOn()?`<div class="tmr" data-timer="${act}"><i></i></div><p class="xs mut">⏳ ${TIMED_S} sekund. Brak decyzji też jest decyzją.</p>`:'';}
let TMR=null;function clearTimer(){if(TMR){clearInterval(TMR);TMR=null;}}
function startTimer(){const el=document.querySelector('[data-timer]');if(!el)return;const act=el.dataset.timer,t0=Date.now(),bar=el.querySelector('i');
 TMR=setInterval(()=>{const left=1-(Date.now()-t0)/(TIMED_S*1000);if(!document.body.contains(el)){clearTimer();return;}bar.style.width=Math.max(0,left*100)+'%';
  if(left<=0){clearTimer();try{A[act]('t');}catch(e){console.error(e);}save();render();}},100);}
function portrait(k,n,dead){const f={heiji:'g1_heiji',mentor:'g1_mentor'}[k];return f&&IMG_HAVE.includes(f)?`<img class="pt ${dead?'dead':''}" src="${f}.webp" alt="">`:`<div class="pt ${dead?'dead':''}">${esc((n||'?')[0])}</div>`;}
const hearts=b=>`<span class="hearts" title="więź">${'♥'.repeat(b)}${'♡'.repeat(3-b)}</span>`;
function viewQuiet(){const r=G.run,q=quietFor(r);if(!q){r.phase='plan';return viewPlan();}
 return`<div class="card"><div class="xs mut">CICHA CHWILA · ${seasonLabel(r.s)}</div><h2>${esc(q.t)}</h2>${q.img?IMG(q.img):''}<p>${esc(q.d(r))}</p>${q.th?thought(q.th(r)):''}${q.ch.map((c,i)=>`<button class="choice" data-a="quiet" data-v="${i}">${esc(lbl(c.l,r))}${c.s?`<small>${esc(c.s)}</small>`:''}</button>`).join('')}</div>`;}
function viewQuietRes(){const r=G.run;return`<div class="card"><h2>${esc(r.qRes.t)}</h2><p>${esc(r.qRes.txt)}</p><button class="btn" data-a="qNext">Do pracy ▶</button></div>`;}
function viewDeath(){const r=G.run,d=curDeath(r);if(!d){deathNext();return viewGame();}const S=SCENE[d.who](r);
 return`<div class="card"><div class="xs mut">${esc(d.how.toUpperCase())}</div><div class="row" style="margin:6px 0"><div style="flex:0 0 auto">${portrait(d.who,d.n,1)}</div><h2 style="flex:3;margin:0">${esc(d.n)}</h2></div>${S.img?IMG(S.img):''}<p>${esc(S.m)}</p>${thought(S.th)}${(S.retro||[]).map(t=>thought(t)).join('')}
 <h3>Jak się pożegnasz?</h3>${farewells(r,d).map(([k,l,s])=>`<button class="choice" data-a="fw" data-v="${k}">${esc(l)}<small>${esc(s)}</small></button>`).join('')}</div>`;}
function viewDeathRes(){const r=G.run;return`<div class="card"><h2>${esc(r.dRes.n)}</h2><p>${esc(r.dRes.t)}</p><button class="btn" data-a="dNext">Dalej</button></div>`;}
function viewRet(){const r=G.run;return`<div class="card"><div class="xs mut">WIOSNA 1185 · POWRÓT</div><h2>Droga do domu</h2>${r.retL.map(t=>`<p>${esc(t)}</p>`).join('')}${thought(r.lost.length?T(r,'„Wracam. Nie wszyscy wracają. Będę to nosił jak drugi kołczan.”','„Wróciłam. Nie wszyscy. Policzę ich jak worki — każdego z imienia.”'):'„Wszyscy. Nie wierzę, dopóki nie dotknę każdej ręki.”')}<button class="btn" data-a="retOk">Koniec wojny ▶</button></div>`;}
function viewPam(){const r=G.run,M=G.meta.mem;
 if(!r||r.phase==='end'){if(!M)return`<div class="card"><h2>🕯️ Pamięć rodu</h2><p class="mut">Tu zostaną ci, którzy byli z tobą: żywi i zmarli. Po końcu gry odsłoni się, co można było zrobić.</p></div>`;
  let h=`<div class="card"><h2>🕯️ Pamięć rodu</h2><p class="sm mut">${esc(M.hero)} z ${esc(M.village)} — ostatnia partia.</p>`;
  h+=M.lost.length?M.lost.map(d=>`<div class="mem"><div class="row"><div style="flex:0 0 auto">${portrait(d.who,d.n,1)}</div><div style="flex:3"><b>${esc(d.n)}</b> <span class="tag">${esc(d.role)}</span><div class="xs mut">${esc(d.how)}</div>${d.item?`<div class="xs">🎴 ${esc(d.item)}</div>`:''}</div></div></div>`).join(''):'<p class="good">Wszyscy przeżyli.</p>';
  h+='</div>';
  if(M.what.length)h+=`<div class="card"><h2>Co można było zrobić</h2>${M.what.map(w=>`<h3>${esc(w.n)}</h3>${w.w.map(x=>`<p class="wi"><span class="${x.ok?'good':'bad'}">${x.ok?'✓':'✗'}</span> ${esc(x.t)}</p>`).join('')}`).join('')}<p class="xs mut">Los ma najwyżej 20% udziału. Resztę decydowały twoje wcześniejsze wybory.</p></div>`;
  if(M.my)h+=sprawaEnd(M.my);
  if(r&&r.chap)h+=chapList(r);return h;}
 const C=r.comp,ppl=[['heiji','Heiji','towarzysz, pachołek z sąsiedniej wsi',C.heiji],['mentor',r.mentor,'stary rōtō, mentor',C.mentor],['father',fatM(r).n,'ojciec',C.father],['sib',sibM(r).n,sibM(r).role.toLowerCase(),C.sib],['mother',r.family[2].n,'matka',C.mother||{b:0,st:'alive'}]];
 let h=`<div class="card"><h2>🕯️ Pamięć rodu</h2><p class="xs mut">Więź rośnie w cichych chwilach. Zmienia to, jak ludzie odchodzą — i czy w ogóle.</p>`;
 ppl.forEach(([k,n,role,c])=>{if(k==='heiji'&&r.s<1)return;const st=c.st||'alive',d=r.lost.find(x=>x.who===k);
  h+=`<div class="mem"><div class="row"><div style="flex:0 0 auto">${portrait(k,n,st==='dead')}</div><div style="flex:3"><b>${esc(n)}</b> ${hearts(c.b||0)}<div class="xs mut">${esc(role)}</div><div class="xs ${st==='dead'?'bad':st==='hurt'?'acc':'good'}">${st==='dead'?'nie żyje — '+esc(d?d.how:''):st==='hurt'?'ranny, żyje':'żyje'}</div>${d&&d.item?`<div class="xs">🎴 ${esc(d.item)}</div>`:''}</div></div></div>`;});
 h+=`<p class="xs mut" style="margin-top:10px">„Co można było zrobić” odsłoni się po końcu gry.</p></div>`;
 return h+sprawaCard(r)+chapList(r);}
function chapList(r){const ks=Object.keys(r.chap||{}).filter(k=>k!=='E3');if(!ks.length)return'';return`<div class="card"><h2>Schematy wypraw</h2>${ks.map(k=>`<h3>${esc(EXP[k].n)}</h3>${chapterHTML(r,k)}`).join('')}</div>`;}

if(typeof document!=='undefined'&&document.getElementById('main'))boot();


/* ---------- Tajemnica: widoki ---------- */
const paras=t=>String(t).split('\n\n').map(x=>`<p>${esc(x)}</p>`).join('');
function viewGift(){const r=G.run,m=r.my,k=m.cur,g=GIFT[k];
 return`<div class="card"><div class="xs mut">CICHY DAR · ${seasonLabel(r.s)}</div><h2>${esc(g.t)}</h2><p>${esc(g.d(r))}</p>${thought(g.th(r))}
 <h3>Co robisz?</h3>
 <button class="choice" data-a="gift" data-v="phys">Obejrzyj dokładnie ${esc(g.obj)}<small>Ślady na przedmiotach nie kłamią</small></button>
 <button class="choice" data-a="gift" data-v="ask">Rozpytaj dyskretnie we wsi<small>Ludzie widzą różne rzeczy. Nie wszystkim warto wierzyć</small></button>
 ${k<3&&!m.watch?`<button class="choice" data-a="gift" data-v="watch">Zaczekaj przy progu przy następnym darze<small>Kosztuje noc bez snu (siły −8)</small></button>`:''}
 <button class="choice" data-a="gift" data-v="none">Przyjmij w milczeniu<small>Czasem dar ma zostać darem</small></button></div>`;}
function viewGiftRes(){const r=G.run;return`<div class="card"><div class="xs mut">${esc(GIFT[r.my.cur].t.toUpperCase())}</div>${paras(r.my.res)}<button class="btn" data-a="gNext">Dalej ▶</button></div>`;}
function viewCase(){const r=G.run,m=r.my,ops=caseOpts(r);
 return`<div class="card"><div class="xs mut">WĘZEŁ NA WORKU · ${seasonLabel(r.s)}</div><h2>Kto zostawia worki?</h2>
 <p>Od kilku pór ktoś po cichu pomaga waszemu domowi. Zebrane ślady: ${m.clues.length}. Czy wiesz już, kto to?</p>
 ${m.clues.map(c=>`<div class="mem"><div class="xs">${c.pl?'🔍 ':'💬 '}${esc(c.txt)}</div></div>`).join('')}
 <p class="xs mut">Ślady przy przedmiotach są pewne. Plotki i sylwetki w ciemności bywają mylące. Pomyłka kosztuje łaskę i zaufanie. W tej porze możesz zgadywać tylko raz.</p>
 ${ops.map(t=>`<button class="choice" data-a="cs" data-v="${t}">${esc(myName(r,t))}<small>${esc(CASE_SUB[t])}</small></button>`).join('')}
 <button class="btn2" style="text-align:center" data-a="cs" data-v="no">Jeszcze nie wiem. Poszukam dalej</button></div>`;}
function viewReveal(){const r=G.run,m=r.my,R=REV[m.t];
 return`<div class="card"><div class="xs mut">PRAWDA O WĘŹLE</div><h2>${esc(myName(r,m.t))}</h2>${paras(R.d(r))}${thought(R.th(r))}<h3>Co robisz?</h3>
 ${R.ch.map((c,i)=>`<button class="choice" data-a="rv" data-v="${i}">${esc(lbl(c.l,r))}</button>`).join('')}</div>`;}
function viewCaseRes(){const r=G.run;return`<div class="card">${paras(r.my.res)}<button class="btn" data-a="cNext">Dalej ▶</button></div>`;}
function sprawaCard(r){const m=r.my;if(!m||!m.gd[0])return'';
 return`<div class="card"><h2>🧵 Węzeł na worku</h2>${m.st==='solved'?`<p class="good">Rozwiązane: ${esc(myName(r,m.t))}.</p>`:`<p class="xs mut">Ktoś po cichu pomaga waszemu domowi. Zebrane ślady: ${m.clues.length}. Wskazać winowajcę możesz latem 1182, latem 1183 i jesienią 1184.</p>`}
 ${m.clues.length?m.clues.map(c=>`<div class="mem"><div class="xs">${c.pl?'🔍 ':'💬 '}${esc(c.txt)}</div></div>`).join(''):'<p class="xs mut">Brak śladów. Oglądaj przedmioty, nasłuchuj, patrz uważniej.</p>'}</div>`;}
function sprawaEnd(M){return`<div class="card"><h2>🧵 Co naprawdę się działo</h2><p>${esc(M.why)}</p><p class="${M.st==='solved'?'good':'bad'}">${M.st==='solved'?'Rozwiązana w trakcie gry.':'Nierozwiązana.'}</p>
 ${M.clues.map(c=>`<p class="wi"><span class="${c.k==='T'?'good':'bad'}">${c.k==='T'?'✓':'✗'}</span> ${esc(c.txt)}${c.k==='D'&&c.ex?`<br><span class="xs mut">Zmyłka: ${esc(c.ex)}</span>`:''}</p>`).join('')||'<p class="xs mut">Nie zebrano śladów.</p>'}</div>`;}

</script>
