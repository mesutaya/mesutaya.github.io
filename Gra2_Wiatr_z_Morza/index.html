<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Wiatr z Morza — RÓD, Gra 2 (1268–1281)</title>
<style>
:root{--bg:#14110f;--card:#1e1a17;--card2:#29231f;--line:#3a322b;--tx:#eee6d8;--mut:#a39a8c;--acc:#c9a227;--good:#7aa36a;--bad:#d0654d;--blue:#6b8fb3;--vio:#b5523b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:rgba(20,17,15,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 10px}
.hrow{display:flex;align-items:center;gap:4px}
.logo{font-weight:800;letter-spacing:.08em;font-size:11px;color:var(--acc);margin-right:auto;white-space:nowrap}
.stat{font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 6px;white-space:nowrap}
.stat b{font-variant-numeric:tabular-nums}
.qs{border:1px solid var(--acc);color:var(--acc);background:none;border-radius:999px;padding:3px 8px;font-size:12px}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:25px;margin:4px 0 6px;letter-spacing:.02em;font-family:Georgia,"Times New Roman",serif}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:13px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
p{margin:6px 0}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.acc{color:var(--acc)}.good{color:var(--good)}.bad{color:var(--bad)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;background:var(--acc);color:#1d1606;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;margin-top:10px}
.btn2{display:block;width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;margin-top:8px;text-align:left}
.btn2:disabled,.btn:disabled,.choice:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 11px;font-size:13px;min-height:36px}
.chip.on{background:var(--acc);color:#1d1606;border-color:var(--acc);font-weight:700}
.chip.pri.on{background:var(--vio);border-color:var(--vio);color:#fff}
.mem{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.mem:first-child{border:0;margin:0;padding:0}
.bar{height:6px;background:#332b25;border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--good)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px;color:var(--mut)}
.graph{overflow:hidden}
.prin{border-left:3px solid var(--vio);padding:6px 0 6px 10px;margin:8px 0}
.log p{margin:4px 0;font-size:14px}
.choice{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:8px;font-size:15px}
.choice small{display:block;color:var(--mut);margin-top:3px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(24,20,17,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 2px 11px;color:var(--mut);font-size:11px;font-weight:600}
nav button span{display:block;font-size:20px;line-height:1.2}nav button.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#352d27;color:var(--tx);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1}
textarea,input[type=text]{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px}
textarea{min-height:80px}
.grid{display:grid;gap:5px;margin:10px auto;touch-action:manipulation}
.cell{aspect-ratio:1;border-radius:8px;background:#2c2622;border:1px solid var(--line)}
.cell.lit{background:#e07b39;box-shadow:0 0 14px rgba(224,123,57,.7)}
.cell.flash{background:var(--blue);box-shadow:0 0 16px rgba(107,143,179,.8)}
.peg{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;color:#111;margin-right:4px}
.fb{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 2px}
.tray{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.piece{padding:6px;border:2px solid transparent;border-radius:10px;background:var(--card2)}.piece.sel{border-color:var(--acc)}
.pg{display:grid;gap:2px}.pg i{width:16px;height:16px;border-radius:3px;display:block}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.check:first-of-type{border:0}
.box{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800}
.box.on{background:var(--good);border-color:var(--good);color:#0c1a12}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpi div{background:var(--card2);border-radius:10px;padding:8px 4px}.kpi b{display:block;font-size:20px}
.warn{background:rgba(208,101,77,.12);border:1px solid rgba(208,101,77,.4);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.ok{background:rgba(122,163,106,.12);border:1px solid rgba(122,163,106,.4);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
svg text{user-select:none}
.th{font-style:italic;color:#e3d6bf;border-left:2px solid var(--acc);padding:2px 0 2px 10px;margin:10px 0}
img.scene,img.cover{display:block;width:100%;border-radius:10px;margin:6px 0 10px;background:#221d19}
img.cover{aspect-ratio:2/3;object-fit:cover}img.scene{aspect-ratio:3/2;object-fit:cover}
.pt{width:56px;height:56px;flex:0 0 56px;border-radius:50%;object-fit:cover;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:22px;color:var(--acc)}
.pt.dead{filter:grayscale(1);opacity:.75}
.tmr{height:6px;background:#332b25;border-radius:6px;overflow:hidden;margin:10px 0 2px}.tmr i{display:block;height:100%;width:100%;background:var(--bad);transition:width .1s linear}
.echo{border-color:#5a4a3a;background:#1a1613}.echo p{font-style:italic;color:#d9cdb8}
.chap{margin-top:4px}.crow{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}.carr{text-align:center;color:var(--mut);font-size:12px;line-height:1.2}
.cn{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--mut);background:var(--card2);max-width:100%}
.cn.my{background:var(--acc);color:#1d1606;border-color:var(--acc);font-weight:700}.cn.fd{color:var(--tx)}
.hearts{color:var(--bad);letter-spacing:2px;font-size:13px}
.wi{font-size:13px;margin:3px 0}.wi .good,.wi .bad{font-weight:800}

 else{const c=st.ch[i];recPath(r,k,i);if(st.place)r.ex.place=c.v;t=c.f(r)||'';if(c.p!=null)t+=(t?' ':'')+`Zasada: ${PR[c.p][0]}.`;}

 for(let g=0;g<20;g++){const st=expStep();if(!st)break;
  if(st.if&&!st.if(r)){r.ex.step++;continue;}

   if(r.ex.id==='B1')kotaroSaves(r);if(r.dead)return end(false,T(r,'Zginąłeś w bitwie.','Zginęłaś w bitwie.'));
   if(r.ex.id==='B1'){kotaroFate(r);szwFate(r);}if(r.ex.id==='B2')gonzaFate(r);continue;}

 if(!expStep())finishExp(r);else flushDeath(r);}
function battle(r){const ex=r.ex,E=EXP[ex.id],fo=force(r,E.need),f=r.hero.sex==='f';ex.tier=2;if(ex.id==='B1')r.fl.foot=r.horses<P(r)?1:0;

 const sk=f?r.hero.bow*.4+r.rep/50:r.hero.bow*.6;
 let pw=fo.F*.7+ex.mod*.8+sk+ex.prep*.5+(ex.id!=="B1"&&r.wall>=3?1:0)+rr()*6-3.5;
 r.arrows=Math.max(0,r.arrows-Math.ceil(fo.p*.7));r.prov=Math.max(0,Math.round((r.prov-fo.p*E.need)*10)/10);
 if(rr()<ex.risk*.07){ex.tier=3;if(!f){r.dead=1;return'Strzała z trucizną. Los dosięga i najlepszych.';}r.men=Math.max(0,r.men-1);ex.earned=0;return'Twój zastępca zginął w walce. Ród stracił wiernego człowieka.';}
 let t;
 if(pw>=7){ex.tier=0;ex.earned=26;r.hero.bxp+=4;t=T(r,'Twoje strzały trafiają, a twoi ludzie trzymają szyk. Wróg cofa się do łodzi. Wszyscy to widzieli.','Twój zastępca i ludzie walczą jak jeden. Dzięki twoim zapasom nikt nie odpadł z sił.');}
 else if(pw>=4.6){ex.tier=1;ex.earned=13;r.hero.bxp+=3;t=T(r,'Trzymasz się z ludźmi, trafiasz kilku wrogów. Porządna walka.','Oddział walczył porządnie i wrócił w komplecie.');}
 else if(pw>=2.4){ex.tier=2;ex.earned=4;r.hero.bxp+=2;if(r.horses>0&&rr()<.5){r.horses--;t='Twój koń pada od strzały. Niewiele zdziałałeś.';}else t='Przeżyłeś zamęt, ale niewiele zdziałałeś.';}
 else{ex.tier=3;ex.earned=0;if(!f&&rr()<ex.risk*.3){r.dead=1;return'Wpadasz między wrogów. To koniec drogi.';}r.men=Math.max(0,r.men-1);if(r.horses>0)r.horses--;t='Klęska oddziału: tracisz człowieka i konia.';}
 if(ex.earned)ex.deed={b:E.n,d:E.d,place:ex.place||{B2:'Shikanoshima',B3:'Takashima'}[ex.id],wit:typeof ex.wit==='string'?ex.wit:(rr()<.4?pick(WITNESSES):null),cmd:ex.id==='B1'?'Shōni Kagesuke':'Adachi Morimune',val:ex.earned,rec:0,doc:0};

 if(st.th&&rr()<st.th*(r.policy==='exp'?1.5:1)){const x=Math.round(inc*.25*10)/10;inc-=x;r.stolen+=x;}

 if(r.estate.unrest>=70)lines.push('🔥 Wieś się burzy: chłopi uciekają z pól (dochód −50%, dopóki niepokój ≥70).');

 if(st.lr)st.m=Math.min(1.15,st.m+st.lr);
 if(r.unl.guard){const q=guardQ(r),sent=Math.min(r.guard,guardMax(r))+(r.focus==='guard'&&!away?2:0);
  if(sent>=q){r.rep=clamp(r.rep+2,0,100);r.stats.gOk++;lines.push(`⛩ Straż na wybrzeżu: ${sent}/${q} — dowódca zadowolony (reputacja +2).`);}
  else{const p=1+2*(q-sent);r.rep=clamp(r.rep-p,0,100);r.stats.gMiss++;lines.push(`⛩ Straż: ${sent}/${q} — za mało (reputacja −${p}).`);errs.push('Za mało ludzi na straży.');}}
 if(wallTurn(r)){if(r.wallOn&&r.rice>=3&&r.men>=1){r.rice-=3;r.wall++;r.rep=clamp(r.rep+2,0,100);lines.push(`🧱 Mur: twój odcinek rośnie (${r.wall}/3, −3 ryżu, reputacja +2).`);}
  else{r.rep=clamp(r.rep-3,0,100);lines.push('🧱 Mur: twój odcinek stoi w miejscu (reputacja −3).');errs.push('Odcinek muru nie postąpił.');}}
 if(!away){if(r.focus==='train'){r.hero.bxp+=3;const nb=Math.min(5,Math.floor(r.hero.bxp/6));lines.push(nb>r.hero.bow?`🏹 ${skillName(r)}: poziom ${nb}.`:`🏹 Ćwiczenie: ${skillName(r)} ${r.hero.bxp}/${Math.min(30,(r.hero.bow+1)*6)}.`);r.hero.bow=Math.max(r.hero.bow,nb);}
  if(r.focus==='guard'&&r.unl.guard){r.zas+=1;r.rep=clamp(r.rep+1,0,100);lines.push('⭐ Dowódca widział cię na straży (zasługa +1).');}
  if(r.focus==='docs'){const d=r.deeds.find(x=>!x.doc);if(d){d.doc=1;r.docs++;lines.push(`📜 Masz pisemne potwierdzenie czynu (${d.place}). Zapis w zakładce Ród.`);}else if(r.docs<2){r.docs++;lines.push('📜 Zbierasz listy od krewnych i sąsiadów o służbie rodu.');}else lines.push('📜 Nie ma czego więcej spisywać.');}}
 const up=Math.round(upkeep(r)*10)/10;r.rice=Math.round((r.rice-up)*10)/10;r.prov=Math.floor(r.prov*.95*10)/10;
 lines.push(`🍚 Utrzymanie ludzi i koni: −${up}. Zostało ${r.rice}.`);
 if(r.rice<0){const lost=Math.min(r.men,Math.ceil(-r.rice/2));r.men-=lost;r.rice=0;if(lost){lines.push(`🚶 Brak ryżu: ${lost} ludzi odchodzi.`);errs.push('Zabrakło ryżu dla ludzi.');}r.guard=Math.min(r.guard,guardMax(r));}
 const due=r.queue.filter(q=>q.s<=r.s);r.queue=r.queue.filter(q=>q.s>r.s);due.forEach(q=>lines.push(`⏳ ${q.msg} ${fx(r,q.o)}`));
 r.gapT=null;r.rep2={echo:dueEchoes(r),lines,errs,own:errs.length&&!away?'pending':null,away:away||r.ex?1:0};r.phase='report';flushDeath(r);}

function finale(r){const rec=r.deeds.filter(d=>d.rec);let ep='';
 if(r.hero.rank<3&&r.zas>=70&&r.rep>=55&&rec.some(d=>d.b!==EXP.B1.n)){promote(r,3);r.estate.lvl+=1;ep='Epilog 1286: Kamakura rozdziela ziemie w Kiusiu. Dostajesz nadanie i tytuł jitō.';}
 else if(r.hero.rank<2&&r.zas>=ZAS2&&r.rep>=28){promote(r,2);ep='Kamakura potwierdza zasługi listem i małą nagrodą.';}
 else if(r.hero.rank<1&&rec.length){promote(r,1);ep='Dowódca potwierdza twój raport. Na nagrodę z Kamakury czekasz latami.';}
 const win=r.hero.rank>=2;

function end(win,reason){const r=G.run;if(r.phase==='end')return true;const s=r.stats;
 const score=Math.max(10,Math.round(r.zas+r.rep+r.rice/2+r.hero.rank*25+s.owned*5-s.blamed*5+s.puz*3+r.estate.lvl*5));
 const L=[];
 if(s.blamed>s.owned)L.push('Częściej szukałeś winnych niż brałeś odpowiedzialność.');

 if(!win&&r.deeds.length&&r.hero.rank<2)L.push('Masz czyny, ale nikt w Kamakurze o nich nie wie. Prowadź w górę: petycja, świadkowie, pisma.');

 r.res={win,reason,score,lessons:L};r.phase='end';r.dq=[];if(r.comp)G.meta.mem={hero:r.hero.n,village:r.village,sex:r.hero.sex,lost:r.lost||[],comp:r.comp,fl:r.fl,sp:r.sp,anc:r.anc||[],what:(r.lost||[]).map(d=>({n:d.n,w:whatIf(r,d.who)}))};G.meta.wins+=win?1:0;return true;}

  pid++;}
 const cols=['#c9a227','#6b8fb3','#7aa36a','#b5523b','#9b7bb0','#5aa6a0','#c98a9b','#a9a65b'];
 const pieces=[];for(let p=0;p<pid;p++){let cs=[];own.forEach((v,i)=>{if(v===p)cs.push([i%W,Math.floor(i/W)]);});if(!cs.length)continue;const rot=ri(4);for(let k=0;k<rot;k++)cs=rotShape(cs);pieces.push({c:norm(cs),col:cols[pieces.length%cols.length]});}
 return{W,H,pieces:shuffle(pieces),placed:{},sel:0};}
function norm(cs){const mx=Math.min(...cs.map(c=>c[0])),my=Math.min(...cs.map(c=>c[1]));return cs.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);}
function rotShape(cs){return norm(cs.map(([x,y])=>[-y,x]));}
function packBoard(z){const b=Array(z.W*z.H).fill(-1);for(const p in z.placed){const o=z.placed[p];z.pieces[p].c.forEach(([x,y])=>{b[(y+o.y)*z.W+(x+o.x)]=+p;});}return b;}
function solvePz(){const r=G.run,z=r.pz;z.done=true;z.win=true;r.stats.puz++;r.roz++;
 const o={mm:{r:1},pack:{p:2},sim:{l:2},lo:{z:1}}[z.k];return fx(r,o);}

function quietFor(r){if(r.hero.away)return null;const q=QUIET[r.s];if(!q||r.qs[r.s])return null;if(!alive(r,q.who))return null;
 if(q.who==='kotaro'&&r.s===13&&!alive(r,'kotaro'))return null;return q;}
function planOrQuiet(r){ensureImm(r);return quietFor(r)?'quiet':'plan';}
function goAfter(r){r.phase=r.after==='plan'?planOrQuiet(r):r.after;flushDeath(r);}
function quietChoose(i){const r=G.run,q=quietFor(r),c=q.ch[i];if(c.need&&!c.need(r))return false;r.qs[r.s]=1;r.qRes={t:q.t,txt:c.f(r)};r.phase='quietres';return true;}

function kotaroRisk(r){const F=r.fl,b3=r.comp.kotaro.b>=3;if((F.front&&F.apart)||(F.foot&&(F.front||F.apart)))return b3?.6:.8;if(F.foot)return b3?.1:.2;if(F.front||F.apart)return .15;return .04;}
function kotaroFate(r){const c=r.comp.kotaro;if(c.st!=='alive')return;const p=kotaroRisk(r),x=rr();
 if(x<p){addDeath(r,'kotaro',T(r,'Torikai-gata, 10/20 1274 — w pierwszym szeregu','Torikai-gata, 10/20 1274 — wieść od zastępcy'));r.ex.fate=2;return;}
 if(p>=.15&&x<p+.3){c.st='hurt';r.hurt.push('kotaro');r.ex.fate=1;r.ex.log.push('Kotarō ranny w ramię. Żyje. Woreczek matki ma przecięty, ale go nie zgubił.');return;}
 r.ex.fate=0;}
function szwFate(r){const c=r.comp.szw;if(c.st!=='alive')return;const F=r.fl,x=rr();let p=0,h=.05;
 if(!F.shield){if(F.front){p=.8;h=.2;}else{p=0;h=.85;}}
 if(x<p){addDeath(r,'szw',T(r,'Hakata, 10/20 1274 — bez osłony','Hakata, 10/20 1274 — wieść od zastępcy'));r.ex.fate2=2;
  const d=r.ex.deed;if(d&&d.wit===SZW+' (szwagier)'){d.wit=null;r.ex.log.push(`Twój jedyny świadek, ${SZW}, nie żyje. Martwy świadek nie zezna.`);}return;}
 if(x<p+h){c.st='hurt';r.hurt.push('szw');r.ex.fate2=1;r.ex.log.push(`${SZW} dostał strzałę w bok. Żyje.`);return;}r.ex.fate2=0;}
function gonzaFate(r){const c=r.comp.gonza;if(c.st!=='alive')return;const F=r.fl;r.ex.fate=0;
 if(F.gonzaHome||r.ex.skip||r.ex.risk===0)return;const p=F.ownBoat?.04:(r.comp.gonza.b>=3?.6:.8),x=rr();
 if(x<p){addDeath(r,'gonza',T(r,'Shikanoshima, noc 1281 — na przeładowanej łodzi','Shikanoshima, noc 1281 — wieść od zastępcy').replace(' — na przeładowanej łodzi',F.ownBoat?' — w łodzi rodu':' — na przeładowanej łodzi'));r.ex.fate=2;return;}
 if(p>=.15&&x<p+.2){c.st='hurt';r.hurt.push('gonza');r.ex.fate=1;r.ex.log.push('Gonza wpadł do morza. Wyciągnęliście go za chorągiew.');}}
function kotaroSaves(r){if(!r.dead||r.ex.id!=='B1'||r.hero.sex!=='m')return;const c=r.comp.kotaro;if(c.b>=3&&c.st==='alive'&&rr()<.8){r.dead=0;r.fl.saved=1;c.st='hurt';r.hurt.push('kotaro');r.ex.log.push('Leżysz pod koniem. Ktoś ciągnie cię za pas po piasku, z dala od tarcz. To Kotarō. Ma krew na twarzy — nie swoją, mówi. Kłamie.');}}

function addDeath(r,who,how){const D={who,how,s:r.s};r.comp[who].st='dead';
 D.n={kotaro:'Kotarō',gonza:'Gonza',szw:SZW}[who];D.role={kotaro:'młody sługa',gonza:'stary sługa ojca',szw:'szwagier'}[who];
 if(who!=='szw')r.men=Math.max(0,r.men-1);

/* ---------- elementy ---------- */
function header(){const r=G.run;const inG=r&&!['end','inter','interres','intro'].includes(r.phase);let h=`<div class="hrow"><span class="logo">${inG?'':'WIATR Z MORZA'}</span>`;
 if(inG)h+=`<span class="stat">${SEAS_I[szOf(r.s)]}<b>${yearOf(r.s)}</b></span><span class="stat">🌾<b class="${r.rice<5?'bad':''}">${Math.floor(r.rice)}</b></span><span class="stat">👥<b>${r.men}</b></span><span class="stat">⭐<b>${r.zas}</b></span><span class="stat">📜<b class="${r.rep<25?'bad':''}">${r.rep}</b></span>`;
 else h+=`<span class="stat">⚡ Dyscyplina <b>${G.meta.disc}</b></span>`;
 return h+`<button class="qs" data-a="qsave" aria-label="Szybki zapis">💾</button></div>`;}
function mentorBox(r,i){const p=PR[i%PR.length];return`<div class="prin"><b>${p[0]}</b><br><span class="sm">${r?`Stary ${esc(r.mentor)}: `:''}„${p[1]}”</span></div><p class="xs mut">W grze: ${p[2]}</p>`;}
function bar(v,bad){return`<div class="bar"><i style="width:${v}%;background:${bad?'var(--bad)':v<60?'var(--acc)':'var(--good)'}"></i></div>`;}
const SYS={log:['🎒 Nowy system: logistyka wojenna','Wojownik wystawia ludzi, konie, strzały i prowiant na własny koszt. Kupuj w karcie „Zaopatrzenie”. Każdy człowiek i koń je co porę. Siła oddziału w bitwie zależy od tego, co przygotujesz teraz.'],
 guard:['⛩ Nowy obowiązek: straż na wybrzeżu','Co porę wysyłasz ludzi na straż. Spełnisz wymaganie — rośnie reputacja u dowódcy. Gdy reputacja spadnie do zera, ród traci status gokenina.'],
 wall:['🧱 Mur i łodzie','Przez 3 pory twój odcinek muru wymaga 3 ryżu i 1 człowieka. Od teraz możesz też kupić łodzie — przydadzą się na morzu.']};
function viewGame(){const r=G.run;if(!r)return viewSetup();ensureImm(r);if(r.pzOpen&&r.phase==='plan')return viewPuzzle();
 const gap=r.gapT&&['hist','histres','quiet','quietres','plan'].includes(r.phase)?`<div class="card echo"><div class="xs mut">MIJAJĄ LATA · ${seasonLabel(r.s)}</div><p>${esc(r.gapT)}</p></div>`:'';
 return gap+({inter:viewInter,interres:viewInterRes,intro:viewIntro,hist:viewHist,histres:viewHistRes,plan:viewPlan,exp:viewExp,pet:viewPet,report:viewReport,event:viewEvent,evres:viewEvRes,end:viewEnd,quiet:viewQuiet,quietres:viewQuietRes,death:viewDeath,deathres:viewDeathRes}[r.phase]||(()=>''))();}
function viewSetup(){const S=UI.setup,L=parseLeg(S.code||'');return`<div class="card">${IMG('g2_okladka','cover')}<div class="xs mut">SERIA „RÓD” · GRA 2</div><h1>Wiatr z Morza</h1><p class="mut">Kiusiu, 1268–1281. Najazdy mongolskie.</p>
 <p>Jesteś młodą głową drobnego rodu <i>gokenin</i> w prowincji Higo. Nadciągają floty Kubilaja. Wojna obronna nie daje zdobytej ziemi — o nagrodę trzeba walczyć dwa razy: w bitwie i w Kamakurze.</p>
 <h3>Kod dziedzictwa z Gry 1</h3><textarea data-in="code1" placeholder="Wklej kod ROD1.… (bez kodu: ród startowy)">${esc(S.code||'')}</textarea>
 <p class="xs ${L?'good':S.code?'bad':'mut'}">${L?`✔ Ród ${esc(String(L.rod).replace(/^ród z /,''))} — przodek ${esc(L.boh)}, ${esc(L.status)}.`:S.code?'To nie jest poprawny kod ROD1. — zagrasz rodem startowym.':'Bez kodu dostajesz ród startowy.'}</p>
 <h3>Kim jesteś</h3><div class="chips"><button class="chip ${S.sex==='m'?'on':''}" data-a="sx" data-v="m">Syn — dziedzic</button><button class="chip ${S.sex==='f'?'on':''}" data-a="sx" data-v="f">Córka — dziedziczka</button></div>
 <p class="xs mut">${S.sex==='m'?'Sam prowadzisz ludzi do bitwy.':'W Kamakurze kobiety mogły być głowami rodów i jitō. Do bitwy wysyłasz zastępcę (daikan), a sama prowadzisz zaopatrzenie i petycje.'}</p>
 <h3>Imię</h3><input type="text" data-in="hname" placeholder="np. ${S.sex==='m'?'Gorō':'Tsuru'}" value="${esc(S.name)}">
 <button class="btn" data-a="newRun">${L?'Wczytaj ród i zacznij':'Zacznij z rodem startowym'}</button>
 <p class="xs mut" style="margin-top:10px">Partie: ${G.meta.runs} · wygrane: ${G.meta.wins}. Gra zapisuje się po każdym ruchu.</p></div>`;}
function viewInter(){const r=G.run,L=r.leg;let h=`<div class="card"><div class="xs mut">PRZERYWNIK · 1185–1268</div><h2>Między wojnami</h2>`;
 if(L)h+=`<div class="row"><div style="flex:0 0 auto">${kamonSVG(r.kamon,64)}</div><div style="flex:3"><p class="sm">Przodek <b>${esc(L.boh)}</b> skończył wojnę Genpei jako <b>${esc(L.status)}</b>.${r.items.length?` Pamiątki: ${r.items.map(esc).join(', ')}.`:''}</p>${r.motto?`<p class="xs acc">Motto rodu: „${esc(r.motto)}”</p>`:''}</div></div>${L.lekcje.length?`<p class="xs mut">Lekcja przodka: ${esc(L.lekcje[0])}</p>`:''}`;
 else h+=`<p class="sm">Twój ród zaczynał od ludzi Miurów w Sagami. Pradziad służył w wojsku Kamakury.</p>`;
 h+=`<h3>1221 · wojna Jōkyū</h3><p>Były cesarz Go-Toba ogłosił regenta Hōjō Yoshitokiego buntownikiem. Hōjō Masako przypomniała wojownikom wschodu łaskę Yoritomo — i armie Kamakury ruszyły na Kioto. Pod Uji rzeka wezbrała od deszczów. Jak walczył twój pradziad?</p>`+INTER.map((c,i)=>`<button class="choice" data-a="inter" data-v="${i}">${esc(c.l)}<small>${esc(c.s)}</small></button>`).join('');
 return h+'</div>';}
function viewInterRes(){const r=G.run;return`<div class="card"><h2>Po wojnie Jōkyū</h2><p>${esc(r.interTxt)}</p><p class="sm">Kamakura skonfiskowała ziemie stronników dworu i rozdała je wojownikom wschodu. Twój ród osiadł w Higo, na Kiusiu. Minęły dwa pokolenia.</p><button class="btn" data-a="interNext">Rok 1268 ▶</button></div>`;}
function viewIntro(){const r=G.run;let h=`<div class="card"><div class="xs mut">1268 · ${esc(r.village.toUpperCase())}, HIGO</div><h2>Głowa rodu</h2><p>Ojciec umarł, ród jest twój. Masz małą posiadłość, ${r.men} ludzi, ${r.horses} ${r.horses===1?'konia':'konie'} i ${Math.floor(r.rice)} miar ryżu w spichrzu. Jesteś gokeninem — wasalem Kamakury. Twój dowódca to Shōni z Dazaifu.</p>${IMG('g2_bohater')}${kyushuSVG(r)}</div>`;
 if(r.anc&&r.anc.length)h+=`<div class="card echo"><h2>🕯️ Przodkowie z Gry 1</h2>${r.anc.map(d=>`<p class="sm">${esc(d.imie||'?')}${d.kto?' — '+esc(d.kto):''}${d.pamiatka?' · 🎴 '+esc(d.pamiatka):''}</p>`).join('')}${r.ancM?`<p>${esc(r.ancM.st)}</p>`:''}</div>`;
 h+=`<div class="card"><h2>🌾 Wybierz zarządcę</h2><p class="sm">Pole i daniny prowadzisz już przez zarządcę (daikan). Ty wyznaczasz politykę — on dba o szczegóły. Zarządcę wybierasz raz.</p>${STEWARDS.map((s,i)=>`<button class="choice ${r.steward&&r.steward.n===s.n?'on':''}" data-a="stew" data-v="${i}">${esc(s.n)} — ${s.t}<small>${esc(s.d)}</small></button>`).join('')}</div>`;
 h+=`<div class="card"><h2>${r.kamonLock?'Herb rodu z Gry 1':'Znak rodu'}</h2>${r.kamonLock?`<div style="text-align:center">${kamonSVG(r.kamon,100)}</div><p class="xs mut" style="text-align:center">Herb przodka zostaje.</p>`:kamonEditor(r)}</div>`;
 return h+`<div class="card">${mentorBox(r,7)}<button class="btn" data-a="begin" ${r.steward?'':'disabled'}>${r.steward?'Zaczynamy ▶':'Najpierw wybierz zarządcę'}</button></div>`;}
function kamonEditor(r){const k=r.kamon;return`<div style="text-align:center">${kamonSVG(k,110)}</div>
 <h3>Obwódka</h3><div class="chips">${['brak','koło','grube koło','podwójne'].map((t,i)=>`<button class="chip ${k.ring===i?'on':''}" data-a="km" data-v="ring:${i}">${t}</button>`).join('')}</div>
 <h3>Motyw</h3><div class="chips">${Object.keys(MOTIFS).map(m=>`<button class="chip ${k.motif===m?'on':''}" data-a="km" data-v="motif:${m}">${MOTIFS[m]}</button>`).join('')}</div>
 <h3>Liczba</h3><div class="chips">${[1,2,3,4].map(n=>`<button class="chip ${k.n===n?'on':''}" data-a="km" data-v="n:${n}">${n}</button>`).join('')}</div>
 <h3>Kolor</h3><div class="chips">${[['#1d1d1d','tusz'],['#9e2f22','cynober'],['#27406a','indygo']].map(([c,t])=>`<button class="chip ${k.col===c?'on':''}" data-a="km" data-v="col:${c}">${t}</button>`).join('')}</div>`;}
function viewHist(){const r=G.run,H=HIST[r.s];let h=`<div class="card"><div class="xs mut">KRONIKA · ${esc(H.dt)}</div><h2>${esc(H.t)}</h2>${H.img?IMG(H.img):''}<p>${esc(H.txt)}</p>`;
 if(H.hs||H.ks)h+=`<p class="xs acc">🗺 Nowe miejsca na mapie.</p>`;
 if(H.exp)h+=`<p class="xs mut">${T(r,'Bitwa: ','Bitwa (walczy zastępca): ')}${EXP[H.exp].n}. Siła: ${force(r,EXP[H.exp].need).p} ludzi, ${Math.min(r.horses,force(r,1).p)} konnych, strzał ${r.arrows}, prowiantu ${r.prov}.</p>`;
 if(H.ch)h+=H.ch.map((c,i)=>{const dis=c.need&&!c.need(r);return`<button class="choice" data-a="hist" data-v="${i}" ${dis?'disabled':''}>${esc(c.l)}${c.s?`<small>${esc(c.s)}</small>`:''}</button>`;}).join('');
 else h+=`<button class="btn" data-a="hist" data-v="">${H.final?'Rachunek końcowy':'Dalej'}</button>`;
 h+='</div>';if(H.lesson!=null)h+=`<div class="card">${mentorBox(r,H.lesson)}</div>`;return h;}
function viewHistRes(){const r=G.run;return`<div class="card"><h2>${esc(HIST[r.s].t)}</h2>${nl(r.histRes)}<button class="btn" data-a="histNext">Dalej ▶</button></div>`;}
function goodsRow(r,k){const G2=GOODS[k];const can=r.rice>=COST[k]&&canBuy(r,k);return`<div class="row" style="margin:6px 0"><div style="flex:3"><b>${G2[0]} ${G2[1]}: ${k==='prov'?r[k].toFixed(1):r[k]}</b><div class="xs mut">${G2[2]}</div></div><button class="chip" style="flex:0 0 44px" data-a="buy" data-v="${k}:-1" ${r[k]<1?'disabled':''}>−</button><button class="chip" style="flex:0 0 44px" data-a="buy" data-v="${k}:1" ${can?'':'disabled'}>+</button></div>`;}
function viewPlan(){const r=G.run,fc=forecast(),st=r.steward,away=r.hero.away;
 let h=`<div class="card"><div class="row"><h2 style="flex:3">${SEAS_I[szOf(r.s)]} ${seasonLabel(r.s)}</h2><span class="tag" style="flex:0 0 auto">${esc(rankName(r))}</span></div>`;
 if(r.newSys&&SYS[r.newSys])h+=`<div class="ok"><b>${SYS[r.newSys][0]}</b><br><span class="sm">${SYS[r.newSys][1]}</span></div>`;
 if(away)h+=`<div class="warn">${T(r,'Jesteś','Jesteś')} w drodze do Kamakury. Zarządca i ludzie działają według twojej polityki.</div>`;
 const net=fc.inc-fc.up;h+=`<div class="kpi"><div><b>+${fc.inc.toFixed(1)}</b><span class="xs mut">dochód</span></div><div><b>−${fc.up.toFixed(1)}</b><span class="xs mut">utrzymanie</span></div><div><b class="${net<0?'bad':'good'}">${net>=0?'+':''}${net.toFixed(1)}</b><span class="xs mut">bilans</span></div></div></div>`;
 h+=`<div class="card"><h2>🌾 Posiadłość — zarządca ${esc(st.n)} <span class="tag">${st.t}</span></h2><p class="xs mut">Delegujesz: ty wybierasz politykę, zarządca robi resztę. Wielkość posiadłości: ${r.estate.lvl.toFixed(2)}.</p><div class="chips">${Object.keys(POLICY).map(k=>`<button class="chip ${r.policy===k?'on':''}" data-a="pol" data-v="${k}">${POLICY[k].i} ${POLICY[k].n}</button>`).join('')}</div><p class="xs" style="margin-top:6px">${POLICY[r.policy].d}</p><div class="xs mut">Niepokój wsi: ${r.estate.unrest}</div>${bar(r.estate.unrest,r.estate.unrest>=60)}</div>`;
 if(r.unl.log){const f=fc.fo;h+=`<div class="card"><h2>🎒 Zaopatrzenie</h2>${['men','horses','arrows','prov'].concat(r.unl.boats?['boats']:[]).map(k=>goodsRow(r,k)).join('')}<p class="xs mut">Ludzi maks. ${menCap(r)} (wielkość posiadłości). Konie ≤ liczba wojowników, strzały ≤ 3 na osobę.</p><div class="ok sm">Oddział: <b>${f.p}</b> ${T(r,'(z tobą)','(z zastępcą)')} · konnych ${f.riders} · strzały ${Math.round(f.ar*100)}% · prowiant ${Math.round(f.pv*100)}%${r.unl.boats?` · łodzie ${r.boats}`:''}</div></div>`;}
 if(r.unl.guard){h+=`<div class="card"><h2>⛩ Straż na wybrzeżu</h2><div class="row"><div style="flex:3">Wysyłasz: <b>${Math.min(r.guard,guardMax(r))}</b> · wymagane: <b>${fc.q}</b>${r.focus==='guard'&&!away?' · ty: +2':''}</div><button class="chip" style="flex:0 0 44px" data-a="guard" data-v="-1">−</button><button class="chip" style="flex:0 0 44px" data-a="guard" data-v="1" ${r.guard>=guardMax(r)?'disabled':''}>+</button></div>`;
  if(wallTurn(r))h+=`<div class="row" style="margin-top:8px"><div style="flex:3">🧱 Odcinek muru: ${r.wall}/3 · koszt 3 ryżu + 1 człowiek</div><button class="chip ${r.wallOn?'on':''}" style="flex:0 0 auto" data-a="wall">${r.wallOn?'Budujemy':'Wstrzymane'}</button></div>`;
  h+=`</div>`;}
 if(!away){const FF=Object.assign({},FOCUS,r.hero.sex==='f'?FOCUS_F:{});h+=`<div class="card"><h2>Ty w tej porze</h2><p class="xs mut">Jedna sprawa osobiście. Resztę delegujesz.</p><div class="chips">${Object.keys(FF).filter(k=>k!=='guard'||r.unl.guard).map(k=>`<button class="chip ${r.focus===k?'on':''}" data-a="focus" data-v="${k}">${FF[k].i} ${FF[k].n}</button>`).join('')}</div><p class="xs" style="margin-top:6px">${(FF[r.focus]||FF.estate).d}</p></div>`;}
 const warn=[];if(r.rice+fc.inc-fc.up<0)warn.push('Zabraknie ryżu — ludzie odejdą!');if(r.unl.guard&&fc.sent<fc.q)warn.push(`Za mało ludzi na straży (${fc.sent}/${fc.q}).`);if(wallTurn(r)&&(!r.wallOn||r.rice<3))warn.push('Mur nie postąpi.');if(r.estate.unrest>=60)warn.push('Wieś blisko buntu.');
 h+=`<div class="card"><div class="${warn.length?'warn':'ok'}">${warn.length?warn.map(w=>'⚠️ '+w).join('<br>'):'Plan wygląda dobrze.'}</div><button class="btn" data-a="exec">Przeżyj tę porę ▶</button></div>`;
 if(r.pz&&!away){const z=r.pz;h+=`<div class="card"><h2>🧩 Trening umysłu</h2>${z.done?`<p class="${z.win?'good':'mut'}">${z.win?'Zaliczony ✔':'Na tę porę koniec.'}</p>`:`<p><b>${PZ[z.k].n}</b> <span class="tag">${PZ[z.k].k}</span></p><p class="xs mut">Nagroda: ${PZ[z.k].r}</p><button class="btn2" data-a="pzOpen">Otwórz ›</button>`}</div>`;}
 h+=`<div class="card"><h2>🧠 Rozwaga: ${r.roz}</h2><p class="xs mut">Za trening, odpowiedzialność i trafne decyzje.</p>
  <button class="btn2" data-a="roz" data-v="calm" ${r.roz<2?'disabled':''}>Mnich uspokaja wieś — niepokój −20 <span class="mut">(2)</span></button>
  <button class="btn2" data-a="roz" data-v="drill" ${r.roz<2?'disabled':''}>Ćwiczenia z mentorem — ${skillName(r)} +4 <span class="mut">(2)</span></button>
  <button class="btn2" data-a="roz" data-v="plea" ${r.roz<2?'disabled':''}>Mentor wstawia się u dowódcy — reputacja +6 <span class="mut">(2)</span></button></div>`;
 return h+`<div class="card">${mentorBox(r,r.s+3)}</div>`;}
function viewExp(){const r=G.run,st=expStep(),E=EXP[r.ex.id];let h=`<div class="card"><div class="xs mut">BITWA · ${esc(E.n.toUpperCase())}</div>`;
 if(r.ex.last)h+=nl(r.ex.last).replace('<p class=""','<p class="sm acc"');
 if(st.merit)h+=`<h2>Raport o służbie (gunchūjō)</h2><p>${T(r,'Po walce dowódca spisuje zasługi. Czyn trzeba potwierdzić świadkiem.','Zastępca wraca. Spisujesz raport dla dowódcy. Czyn trzeba potwierdzić świadkiem.')}</p>`+[['Opisz dokładnie, ze świadkiem','Prawda'],['Dodaj coś od siebie — kto sprawdzi?','Więcej zasług… jeśli się nie wyda'],['Wpisz też towarzysza, który cię osłaniał','Mniej dla ciebie, ale pewny świadek']].map(([l,s],i)=>`<button class="choice" data-a="exp" data-v="${i}">${l}<small>${s}</small></button>`).join('');
 else h+=`${st.img?IMG(st.img):''}<p>${esc(st.d(r))}</p>${st.th?thought(st.th(r)):''}${st.timed?timerBar('exp'):''}`+st.ch.map((c,i)=>`<button class="choice" data-a="exp" data-v="${i}">${esc(lbl(c.l,r))}${c.s?`<small>${esc(lbl(c.s,r))}</small>`:''}</button>`).join('');
 return h+'</div>';}
function viewPet(){const r=G.run,p=r.pet,st=petStep();let h=`<div class="card"><div class="xs mut">KAMAKURA · PETYCJA</div>`;
 if(p.last)h+=`<p class="sm acc">${esc(p.last)}</p>`;
 if(p.res)return h+`<h2>Wyrok Adachiego</h2><p>${esc(p.res)}</p>${p.luck!=null?`<p class="xs mut">Nastrój urzędu i inni petenci: ${p.luck>0?'sprzyjali':p.luck<-1?'przeszkadzali':'bez wpływu'}.</p>`:''}<button class="btn" data-a="petNext">Wracam do Higo ▶</button></div>${'<div class="card">'+mentorBox(r,9)+'</div>'}`;
 if(st.gate)return h+`<h2>U bramy Adachiego Yasumoriego</h2>${IMG('g2_brama_kamakura')}<p>Urzędnik od nagród przyjmuje tylko nielicznych. Przed bramą czekają dziesiątki wojowników z całego kraju.</p>${thought(gateThought(r))}${[['Czekaj codziennie u bramy','Cierpliwość (zużywa 1 Rozwagi, jeśli masz)'],['Daj podarunek sekretarzowi','−4 ryżu, ryzyko wstydu'],['Szukaj krewnych z Sagami','Pomoże, jeśli przodek był kimś']].map(([l,s],i)=>`<button class="choice" data-a="pet" data-v="${i}">${l}<small>${s}</small></button>`).join('')}</div>`;
 if(st.qa)return h+`<h2>Adachi pyta (${st.n}/${st.of})</h2><p>„${esc(st.qa.q)}”</p>${st.qa.o.map(o=>`<button class="choice" data-a="pet" data-v="${esc(o)}">${esc(o)}</button>`).join('')}<p class="xs mut">Pisma o twoich czynach są w zakładce Ród — jeśli je zebrałeś.</p></div>`;
 return h+'</div>';}
function viewReport(){const r=G.run,R=r.rep2;let h='';if(R.echo&&R.echo.length)h+=`<div class="card echo">${R.echo.includes(MOTHER[0])?IMG('g2_matka','cover'):''}${R.echo.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`;
 if(r.chapNew)h+=`<div class="card">${chapterHTML(r,r.chapNew)}</div>`;
 h+=`<div class="card"><h2>${R.away?'Gdy cię nie było…':'Raport'} — ${seasonLabel(r.s)}</h2>`;
 if(R.away&&r.ex)h+=`<div class="log">${r.ex.log.filter(Boolean).map(l=>nl(l)).join('')}</div><h3>Posiadłość sama</h3>`;
 h+=`<div class="log">${R.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;
 if(R.errs.length){h+=`<h3>Co poszło źle</h3>${R.errs.map(e=>`<p class="bad sm">❌ ${esc(e)}</p>`).join('')}`;
  if(R.own==='pending')h+=`<h3>Czyja to wina?</h3><button class="choice" data-a="own" data-v="me">„Moja. Źle zaplanowałem.”<small>Ekstremalna odpowiedzialność</small></button><button class="choice" data-a="own" data-v="them">„Ludzie i zarządca zawiedli.”<small>Szukanie winnych</small></button>`;
  else if(R.ownTxt)h+=`<p class="sm acc">${esc(R.ownTxt)}</p>`;}
 return h+`<button class="btn" data-a="next" ${R.own==='pending'?'disabled':''}>Dalej</button></div>`;}

  if(packBoard(z).every(c=>c>=0))toast('Wóz załadowany! Rozwaga +1 '+solvePz());},
 simShow:()=>{const z=G.run.pz;z.st='show';z.pos=0;render();runSim();return'norender';},
 simCell:v=>{const z=G.run.pz;if(z.st!=='input')return'norender';const i=+v;flash(i);if(z.seq[z.pos]===i){z.pos++;if(z.pos>=z.seq.length){z.st='ok';toast('Sygnały zapamiętane! Rozwaga +1 '+solvePz());}else return'norender';}else{z.st='fail';toast('Pomyłka.');}},
 simRetry:()=>{const z=G.run.pz;z.seq=Array.from({length:z.len},()=>ri(16));z.st='ready';z.pos=0;},
 loCell:v=>{const z=G.run.pz;loPress(z.b,+v);z.moves++;if(z.b.every(x=>!x))toast('Ogniska zgaszone! Rozwaga +1 '+solvePz());},
 mis:v=>{const M=G.meta,ms=todayMissions(),i=+v;ms.done[i]=!ms.done[i];M.disc+=ms.done[i]?1:-1;
  if(ms.done.every(Boolean)&&M.lastFull!==dkey()){M.streak=M.lastFull===dkey(-1)?M.streak+1:1;M.lastFull=dkey();M.disc+=2;toast(`Wszystkie misje! Seria: ${M.streak} 🔥`);}},
 planDone:v=>{const p=G.meta.plans[dkey()];if(p)p.done[+v]=!p.done[+v];},
 qsave:()=>{const s=getSlots();s.q={t:stamp(),d:desc(G),g:G};toast(setSlots(s)?'Zapisano (szybki zapis).':'Nie udało się — użyj kodu zapisu.');},
 slotSave:v=>{const s=getSlots();s[v]={t:stamp(),d:desc(G),g:G};toast(setSlots(s)?`Zapisano w slocie ${v}.`:'Błąd zapisu — użyj kodu.');},
 slotLoad:v=>{const s=getSlots();if(!s[v])return;G=JSON.parse(JSON.stringify(s[v].g));UI.tab='gra';toast('Wczytano.');},
 copyCode:()=>{copyFrom('code',enc(G));return'norender';},
 loadCode:()=>{const t=document.getElementById('imp');try{G=dec(t.value);UI.tab='gra';toast('Wczytano z kodu.');}catch(e){toast('To nie jest poprawny kod zapisu.');}},
 reset:()=>{if(UI.confirm!=='reset'){UI.confirm='reset';toast('Dotknij jeszcze raz, by skasować wszystko.');return;}UI.confirm=null;G=blank();toast('Wyczyszczono.');}
};
function runSim(){const z=G.run.pz;let k=0;const step=()=>{if(!G.run||G.run.pz!==z||z.st!=='show')return;if(k>=z.seq.length){z.st='input';z.pos=0;save();render();return;}flash(z.seq[k],'lit',450);k++;setTimeout(step,700);};setTimeout(step,500);}
function flash(i,cls='flash',ms=250){const el=document.querySelector(`[data-cell="${i}"]`);if(!el)return;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms);}
function boot(){G=loadAuto();
 document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||!el.dataset.a)return;const f=A[el.dataset.a];if(!f)return;if(el.dataset.a!=='abandon'&&el.dataset.a!=='reset')UI.confirm=null;
  let res;try{res=f(el.dataset.v,el);}catch(err){console.error(err);toast('Błąd: '+err.message);}save();if(res!=='norender')render();});
 document.addEventListener('input',e=>{const el=e.target,k=el.dataset.in;if(!k)return;
  if(k==='hname')UI.setup.name=el.value;
  if(k==='code1'){UI.setup.code=el.value;render();return;}
  if(k==='lesson'&&G.run){G.run.lesson=el.value;const t=document.getElementById('leg');if(t)t.value=legacy(G.run);}
  if(k==='motto'&&G.run){G.run.motto=el.value;const t=document.getElementById('leg');if(t)t.value=legacy(G.run);}
  if(k==='plan'){const d=dkey(1);const p=G.meta.plans[d]||(G.meta.plans[d]={items:['','',''],done:[false,false,false]});p.items[+el.dataset.v]=el.value;const ks=Object.keys(G.meta.plans).sort();while(ks.length>14)delete G.meta.plans[ks.shift()];}
  save();});
 if(G.run&&G.run.pz&&G.run.pz.k==='sim'&&G.run.pz.st==='show')G.run.pz.st='ready';
 render();}

/* ---------- widoki immersji ---------- */
function thought(t){return`<p class="th">${esc(t)}</p>`;}
function timerBar(act){return timedOn()?`<div class="tmr" data-timer="${act}"><i></i></div><p class="xs mut">⏳ ${TIMED_S} sekund. Brak decyzji też jest decyzją.</p>`:'';}
let TMR=null;function clearTimer(){if(TMR){clearInterval(TMR);TMR=null;}}
function startTimer(){const el=document.querySelector('[data-timer]');if(!el)return;const act=el.dataset.timer,t0=Date.now(),bar=el.querySelector('i');
 TMR=setInterval(()=>{const left=1-(Date.now()-t0)/(TIMED_S*1000);if(!document.body.contains(el)){clearTimer();return;}bar.style.width=Math.max(0,left*100)+'%';
  if(left<=0){clearTimer();try{A[act]('t');}catch(e){console.error(e);}save();render();}},100);}
const PORT={kotaro:'g2_kotaro',gonza:'g2_gonza',szw:'g2_szwagier'};
function portrait(k,n,dead){const f=PORT[k];return f&&IMG_HAVE.includes(f)?`<img class="pt ${dead?'dead':''}" src="${f}.webp" alt="">`:`<div class="pt ${dead?'dead':''}">${esc((n||'?')[0])}</div>`;}
const hearts=b=>`<span class="hearts" title="więź">${'♥'.repeat(b)}${'♡'.repeat(3-b)}</span>`;
function viewQuiet(){const r=G.run,q=quietFor(r);if(!q){r.phase='plan';return viewPlan();}
 return`<div class="card"><div class="xs mut">CICHA CHWILA · ${seasonLabel(r.s)}</div><h2>${esc(q.t)}</h2>${q.img?IMG(q.img):''}<p>${esc(q.d(r))}</p>${q.th?thought(q.th(r)):''}${q.ch.map((c,i)=>{const dis=c.need&&!c.need(r);return`<button class="choice" data-a="quiet" data-v="${i}" ${dis?'disabled':''}>${esc(qLabel(c,r))}${c.s?`<small>${esc(c.s)}</small>`:''}</button>`;}).join('')}</div>`;}
function viewQuietRes(){const r=G.run;return`<div class="card"><h2>${esc(r.qRes.t)}</h2><p>${esc(r.qRes.txt)}</p><button class="btn" data-a="qNext">Do pracy ▶</button></div>`;}
function viewDeath(){const r=G.run,d=curDeath(r);if(!d){deathNext();return viewGame();}const S=SCENE[d.who](r);
 return`<div class="card"><div class="xs mut">${esc(d.how.toUpperCase())}</div><div class="row" style="margin:6px 0"><div style="flex:0 0 auto">${portrait(d.who,d.n,1)}</div><h2 style="flex:3;margin:0">${esc(d.n)}</h2></div>${S.img?IMG(S.img):''}<p>${esc(S.m)}</p>${thought(S.th)}
 <h3>Jak się pożegnasz?</h3>${farewells(r,d).map(([k,l,s])=>`<button class="choice" data-a="fw" data-v="${k}">${esc(l)}<small>${esc(s)}</small></button>`).join('')}</div>`;}
function viewDeathRes(){const r=G.run;return`<div class="card"><h2>${esc(r.dRes.n)}</h2><p>${esc(r.dRes.t)}</p><button class="btn" data-a="dNext">Dalej</button></div>`;}
function ancCard(a){return a&&a.length?`<div class="card"><h2>Przodkowie z Gry 1</h2>${a.map(d=>`<div class="mem"><b>${esc(d.imie||'?')}</b>${d.kto?` <span class="tag">${esc(d.kto)}</span>`:''}${d.jak?`<div class="xs mut">${esc(d.jak)}</div>`:''}${d.pamiatka?`<div class="xs">🎴 ${esc(d.pamiatka)}</div>`:''}</div>`).join('')}</div>`:'';}
function memRow(k,n,role,c,d){const st=c.st||'alive';return`<div class="mem"><div class="row"><div style="flex:0 0 auto">${portrait(k,n,st==='dead')}</div><div style="flex:3"><b>${esc(n)}</b> ${hearts(c.b||0)}<div class="xs mut">${esc(role)}</div><div class="xs ${st==='dead'?'bad':st==='hurt'?'acc':'good'}">${st==='dead'?'nie żyje — '+esc(d?d.how:''):st==='hurt'?'ranny, żyje':'żyje'}</div>${d&&d.item?`<div class="xs">🎴 ${esc(d.item)}</div>`:''}</div></div></div>`;}
function viewPam(){const r=G.run,M=G.meta.mem;
 if(!r||r.phase==='end'){if(!M)return`<div class="card"><h2>🕯️ Pamięć rodu</h2><p class="mut">Tu zostaną ci, którzy byli z tobą: żywi i zmarli. Po końcu gry odsłoni się, co można było zrobić.</p></div>`;
  let h=`<div class="card"><h2>🕯️ Pamięć rodu</h2><p class="sm mut">${esc(M.hero)} z ${esc(M.village)} — ostatnia partia.</p>`;
  h+=M.lost.length?M.lost.map(d=>`<div class="mem"><div class="row"><div style="flex:0 0 auto">${portrait(d.who,d.n,1)}</div><div style="flex:3"><b>${esc(d.n)}</b> <span class="tag">${esc(d.role)}</span><div class="xs mut">${esc(d.how)}</div>${d.item?`<div class="xs">🎴 ${esc(d.item)}</div>`:''}</div></div></div>`).join(''):'<p class="good">Wszyscy przeżyli.</p>';
  h+='</div>';
  if(M.what.length)h+=`<div class="card"><h2>Co mogłem zrobić</h2>${M.what.map(w=>`<h3>${esc(w.n)}</h3>${w.w.map(x=>`<p class="wi"><span class="${x.ok?'good':'bad'}">${x.ok?'✓':'✗'}</span> ${esc(x.t)}</p>`).join('')}`).join('')}<p class="xs mut">Los ma najwyżej 20% udziału. Resztę decydowały twoje wcześniejsze wybory.</p></div>`;
  h+=ancCard(M.anc);if(r&&r.chap)h+=chapList(r);return h;}
 const C=r.comp,ppl=[['kotaro','Kotarō','młody sługa, syn sługi ojca',C.kotaro,r.s>=3],['gonza','Gonza','stary sługa ojca, niesie chorągiew',C.gonza,1],['szw',SZW,'szwagier, brat '+(r.hero.sex==='f'?'męża':'żony')+' — świadek',C.szw,1],['sp',r.sp.n,spW(r)+(r.sp.child?', syn '+r.sp.child:''),C.sp,1]];
 let h=`<div class="card"><h2>🕯️ Pamięć rodu</h2><p class="xs mut">Więź rośnie w cichych chwilach. Zmienia to, jak ludzie odchodzą — i czy w ogóle.</p>`;
 ppl.forEach(([k,n,role,c,show])=>{if(!show)return;h+=memRow(k,n,role,c,r.lost.find(x=>x.who===k));});
 h+=`<p class="xs mut" style="margin-top:10px">„Co mogłem zrobić” odsłoni się po końcu gry.</p></div>`;
 return h+ancCard(r.anc)+chapList(r);}
function chapList(r){const ks=Object.keys(r.chap||{});if(!ks.length)return'';return`<div class="card"><h2>Schematy bitew</h2>${ks.map(k=>`<h3>${esc(EXP[k].n)}</h3>${chapterHTML(r,k)}`).join('')}</div>`;}

if(typeof document!=='undefined'&&document.getElementById('main'))boot();

</script>
